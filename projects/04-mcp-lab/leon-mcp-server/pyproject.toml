[project]
name = "leon-mcp-server"
version = "0.1.0"
description = "MCP server exposing the existing Leon image-generation tool service."
requires-python = ">=3.10"
dependencies = [
  "leon-agent",
  "mcp>=1.14,<2",
]

[project.scripts]
leon-mcp = "leon_mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leon_mcp_server"]

[tool.uv.sources]
leon-agent = { workspace = true }
