[project]
name = "code-agent"
version = "0.1.0"
description = "Phase 02: tool-using code analysis agent."
requires-python = ">=3.10"
dependencies = [
  "workbench-core",
  "llm-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_agent"]

[tool.uv.sources]
workbench-core = { workspace = true }
llm-core = { workspace = true }
