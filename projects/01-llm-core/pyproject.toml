[project]
name = "llm-core"
version = "0.1.0"
description = "Phase 01: LLM API, prompts, and structured output."
requires-python = ">=3.10"
dependencies = [
  "workbench-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_core"]

[tool.uv.sources]
workbench-core = { workspace = true }
