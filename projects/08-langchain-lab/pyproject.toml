[project]
name = "langchain-lab"
version = "0.1.0"
description = "Small, interview-oriented LangChain component lab."
requires-python = ">=3.10"
dependencies = [
  "workbench-core",
  "rag-lab",
  "langchain>=1,<2",
  "langchain-core>=1,<2",
  "langchain-openai>=1,<2",
]

[project.scripts]
langchain-lab = "langchain_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_lab"]

[tool.uv.sources]
workbench-core = { workspace = true }
rag-lab = { workspace = true }
