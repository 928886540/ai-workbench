<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Leon Agent">
<meta name="theme-color" content="#2783DE">
<link rel="manifest" href="manifest.json">
<title>Leon Agent</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif;font-size:16px;line-height:1.5;background:#fff;color:#2C2C2B;-webkit-font-smoothing:antialiased}
:root{
  --blue:#2783DE;--blue-soft:#E5F2FC;
  --green:#46A171;--green-soft:#E8F1EC;
  --orange:#D5803B;--orange-soft:#FBEBDE;
  --red:#E56458;--red-soft:#FCE9E7;
  --purple:#7B5EA7;--purple-soft:#EDE8F5;
  --surface:#F9F8F7;--surface2:#F0EFED;
  --border:#E6E5E3;--text:#2C2C2B;--text2:#7D7A75;
  --nav-h:56px;--header-h:52px;
}
#app{position:fixed;inset:0;width:100%;display:flex;flex-direction:column;height:100dvh;min-height:0;overflow:hidden}

/* Login */
#login-screen{position:fixed;inset:0;background:#fff;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px calc(32px + env(safe-area-inset-bottom));gap:0}
#login-screen.hidden{display:none}
.login-logo{font-size:56px;margin-bottom:8px;line-height:1}
.login-title{font-size:26px;font-weight:700;letter-spacing:-.5px;margin-bottom:6px}
.login-sub{font-size:14px;color:var(--text2);margin-bottom:40px;text-align:center}
.login-field{width:100%;max-width:320px;margin-bottom:12px}
.login-field label{display:block;font-size:13px;font-weight:500;color:var(--text2);margin-bottom:6px}
.login-field input{width:100%;border:1.5px solid var(--border);border-radius:12px;padding:13px 16px;font-size:16px;outline:none;font-family:inherit;transition:border-color .15s}
.login-field input:focus{border-color:var(--blue)}
#login-error{color:var(--red);font-size:13px;min-height:18px;margin-bottom:4px;text-align:center;max-width:320px}
#login-btn{width:100%;max-width:320px;padding:15px;background:var(--blue);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;margin-top:4px;transition:opacity .15s}
#login-btn:disabled{opacity:.5;cursor:default}
.login-hint{margin-top:20px;font-size:12px;color:var(--text2);text-align:center;max-width:300px}

/* Header */
#header{height:var(--header-h);display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--border);background:#fff;position:sticky;top:0;z-index:20}
#header h1{font-size:17px;font-weight:600;letter-spacing:-.3px}
#header-right{display:flex;align-items:center;gap:10px}
#status-wrap{display:flex;align-items:center;gap:6px}
#status-dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:background .3s}
#status-dot.online{background:var(--green)}
#status-dot.error{background:var(--red)}
#status-dot.connecting{background:var(--orange)}
#status-label{font-size:12px;color:var(--text2)}
#timeline-toggle{border:none;background:var(--surface2);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;color:var(--text2);transition:all .15s;white-space:nowrap}
#timeline-toggle.active{background:#1a1a2e;color:#fff}

/* Pages */
#pages{flex:1;min-height:0;overflow:hidden;position:relative}
.page{position:absolute;inset:0;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;touch-action:pan-y;display:none;flex-direction:column}
.page.active{display:flex}

/* Chat */
#page-chat{overflow:hidden;touch-action:none}
#chat-messages{flex:1;min-height:0;padding:12px 12px 8px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;touch-action:pan-y;overflow-anchor:none}
#chat-input-wrap{flex-shrink:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:#fff;display:flex;align-items:flex-end;gap:8px;position:relative;z-index:5}
#chat-input{display:block;flex:1;width:100%;min-height:40px;border:1.5px solid var(--border);border-radius:20px;padding:9px 14px;font-size:16px;outline:none;resize:none;max-height:120px;line-height:1.4;font-family:inherit;color:var(--text);background:#fff;caret-color:var(--blue);-webkit-user-select:text;user-select:text;touch-action:manipulation;transition:border-color .15s}
#chat-input:focus{border-color:var(--blue)}
#send-btn{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:opacity .15s}
#send-btn:disabled{opacity:.4;cursor:default}
#mode-suggestions{position:absolute;left:12px;right:60px;bottom:calc(100% + 6px);max-height:min(44vh,320px);overflow-y:auto;background:#fff;border:1px solid var(--border);box-shadow:0 8px 28px rgba(0,0,0,.14);z-index:30}
#mode-suggestions[hidden]{display:none}
.mode-suggestion{width:100%;min-height:48px;border:0;border-bottom:1px solid var(--border);background:#fff;padding:7px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;color:var(--text);font:inherit;cursor:pointer}
.mode-suggestion:last-child{border-bottom:0}
.mode-suggestion.active{background:var(--blue-soft)}
.mode-suggestion-name{font-size:14px;font-weight:600}
.mode-suggestion-id{font-family:Menlo,monospace;font-size:11px;color:var(--text2);overflow-wrap:anywhere;text-align:right}

/* Bubbles */
.bubble-wrap{display:flex;flex-direction:column;max-width:85%;gap:2px}
.bubble-wrap.user{align-self:flex-end;align-items:flex-end}
.bubble-wrap.agent{align-self:flex-start;align-items:flex-start}
.bubble{padding:9px 13px;border-radius:18px;font-size:15px;line-height:1.45;word-break:break-word;white-space:pre-wrap}
.bubble.user{background:var(--blue);color:#fff;border-bottom-right-radius:5px}
.bubble.agent{background:var(--surface);color:var(--text);border-bottom-left-radius:5px}
.bubble.agent.streaming::after{content:'▋';animation:blink .7s step-start infinite}
@keyframes blink{50%{opacity:0}}

/* Tool cards */
.tool-card{align-self:flex-start;background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:10px 13px;font-size:13px;max-width:92%}
.tool-header{display:flex;align-items:center;gap:7px;font-weight:600;font-size:14px}
.tool-icon{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.tool-icon.running{background:var(--blue-soft);color:var(--blue)}
.tool-icon.done{background:var(--green-soft);color:var(--green)}
.tool-icon.failed{background:var(--red-soft);color:var(--red)}
.tool-meta{margin-top:6px;color:var(--text2);font-size:12px;display:flex;flex-direction:column;gap:3px}

/* Status badges */
.status-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.status-badge.queued{background:var(--surface2);color:var(--text2)}
.status-badge.running{background:var(--blue-soft);color:var(--blue)}
.status-badge.completed{background:var(--green-soft);color:var(--green)}
.status-badge.failed{background:var(--red-soft);color:var(--red)}
.status-badge.cancelled{background:var(--surface2);color:var(--text2)}

/* Image card */
.image-card{align-self:flex-start;border-radius:14px;overflow:hidden;border:1px solid var(--border);max-width:min(280px,85%)}
.image-card img{width:100%;display:block;object-fit:cover}
.image-card .image-meta{padding:8px 10px;font-size:11px;color:var(--text2);background:#fff}
.image-card .image-meta a{color:var(--blue);text-decoration:none}

/* Tasks page */
#page-tasks{padding:12px;gap:8px}
.task-item{background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:5px}
.task-top{display:flex;align-items:center;justify-content:space-between}
.task-mode{font-size:15px;font-weight:650;color:var(--text)}
.task-source{font-size:13px;line-height:1.45;color:var(--text2);white-space:pre-wrap;word-break:break-word}
.task-details{margin-top:3px;font-size:11px;color:var(--text2)}
.task-details summary{cursor:pointer;user-select:none}
.task-detail-row{margin-top:4px;font-family:Menlo,monospace;word-break:break-all}

/* Gallery */
#page-gallery{padding:12px;flex-direction:column;gap:8px}
#gallery-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.gallery-img-wrap{border-radius:12px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.gallery-img-wrap img{width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:pointer}
.gallery-meta{padding:6px 8px;font-size:11px;color:var(--text2)}

/* Fullscreen image album viewer */
#image-viewer{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.94);overflow:hidden;touch-action:none}
#image-viewer[hidden]{display:none}
/* Stage is padded so the image never sits under the chrome at scale 1. */
#image-viewer-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;
  padding:calc(60px + env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom))}
#image-viewer img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;transform-origin:center center;will-change:transform;touch-action:none;user-select:none;-webkit-user-drag:none}
#image-viewer img.iv-settling{transition:transform .22s cubic-bezier(.22,.61,.36,1)}
/* The image creates its own stacking context (will-change:transform) and comes
   later in DOM order, so every control needs an explicit z-index to stay above it. */
.iv-chrome{position:absolute;z-index:3}
#image-viewer-close{top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:30px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer}
#image-viewer-counter{top:max(20px,calc(env(safe-area-inset-top) + 8px));left:50%;transform:translateX(-50%);color:rgba(255,255,255,.85);font-size:13px;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.13);border-radius:20px;padding:5px 12px;pointer-events:none;white-space:nowrap}
.iv-nav{top:50%;margin-top:-22px;width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:26px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer}
#image-viewer-prev{left:max(10px,env(safe-area-inset-left))}
#image-viewer-next{right:max(10px,env(safe-area-inset-right))}
.iv-chrome[hidden]{display:none}

/* Debug */
.debug-section{background:var(--surface);border-radius:10px;padding:12px}
.debug-btn{margin-top:8px;padding:8px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;font-size:13px;cursor:pointer;width:100%}

/* Settings */
#page-settings{padding:12px;gap:8px}
.settings-section{background:var(--surface);border-radius:10px;padding:14px}
.settings-section h3{font-size:15px;font-weight:650;margin-bottom:4px}
.settings-sub{font-size:12px;color:var(--text2);margin-bottom:12px}
.settings-row{display:flex;align-items:center;gap:8px}
#model-input{flex:1;min-width:0;border:1px solid var(--border);border-radius:9px;background:#fff;color:var(--text);padding:10px 12px;font:inherit;font-size:14px}
#model-refresh{width:40px;height:40px;border:1px solid var(--border);border-radius:9px;background:#fff;color:var(--text2);font-size:21px;cursor:pointer;flex-shrink:0}
#model-save{border:1px solid var(--blue);border-radius:9px;background:var(--blue);color:#fff;padding:10px 13px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
#model-save:disabled{opacity:.5;cursor:default}
#model-status{min-height:18px;margin-top:8px;font-size:12px;color:var(--text2)}
#model-status.error{color:var(--red)}
/* Tappable model list — datalist has no usable dropdown on mobile browsers. */
#model-list{margin-top:10px;max-height:250px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border:1px solid var(--border);border-radius:10px;background:#fff}
#model-list:empty{display:none}
.model-option{width:100%;border:0;border-bottom:1px solid var(--border);background:none;padding:11px 12px;display:flex;align-items:center;gap:8px;font:inherit;font-size:14px;color:var(--text);text-align:left;cursor:pointer}
.model-option:last-child{border-bottom:0}
.model-option:active{background:var(--surface2)}
.model-option.selected{background:var(--blue-soft);color:var(--blue);font-weight:600}
.model-option-id{overflow-wrap:anywhere}
.model-option-tag{margin-left:auto;font-size:11px;font-weight:500;color:var(--text2);background:var(--surface2);border-radius:20px;padding:2px 8px;flex-shrink:0}
.model-empty{padding:12px;font-size:13px;color:var(--text2);text-align:center}
/* Voice */
.settings-toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--border)}
.settings-toggle:last-of-type{border-bottom:0}
.settings-toggle-label{font-size:14px}
.settings-toggle-hint{font-size:11px;color:var(--text2);margin-top:2px}
.switch{position:relative;width:46px;height:28px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch-track{position:absolute;inset:0;background:var(--surface2);border-radius:28px;transition:background .18s;cursor:pointer}
.switch-track::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s}
.switch input:checked + .switch-track{background:var(--blue)}
.switch input:checked + .switch-track::after{transform:translateX(18px)}
.switch input:disabled + .switch-track{opacity:.45;cursor:default}
#voice-list{margin-top:10px;max-height:250px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border:1px solid var(--border);border-radius:10px;background:#fff}
#voice-list:empty{display:none}
#voice-search{flex:1;min-width:0;min-height:44px;border:1px solid var(--border);border-radius:9px;background:#fff;color:var(--text);padding:10px 12px;font:inherit;font-size:16px}
#voice-refresh{width:44px;height:44px;border:1px solid var(--border);border-radius:9px;background:#fff;color:var(--text2);font-size:22px;cursor:pointer;flex-shrink:0}
#voice-list{max-height:min(52dvh,420px)}
.voice-option{width:100%;border:0;border-bottom:1px solid var(--border);background:none;padding:10px 12px;display:flex;align-items:center;gap:8px;font:inherit;font-size:14px;color:var(--text);text-align:left;cursor:pointer}
.voice-option:last-child{border-bottom:0}
.voice-option.selected{background:var(--blue-soft);color:var(--blue);font-weight:600}
.voice-option-main{flex:1;min-width:0}
.voice-option-name{overflow-wrap:anywhere}
.voice-option-model{font-size:11px;color:var(--text2);font-weight:400;margin-top:1px}
.voice-demo{flex-shrink:0;width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:#fff;color:var(--text2);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.voice-star{flex-shrink:0;width:30px;height:30px;border:0;background:none;font-size:15px;cursor:pointer;line-height:1;opacity:.35}
.voice-star.on{opacity:1}
.voice-section-label{padding:7px 12px;font-size:11px;font-weight:600;color:var(--text2);background:var(--surface);border-bottom:1px solid var(--border)}
/* Voice bubbles + toolbar button */
.bubble-toolbar{display:flex;align-items:center;gap:2px;flex-wrap:wrap;margin-top:2px}
.bubble-act{border:0;background:none;padding:5px;color:var(--text2);cursor:pointer;line-height:0;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;min-width:30px;min-height:30px}
.bubble-act:active{background:var(--surface2)}
.bubble-act.ok{color:var(--green)}
.bubble-act.busy{cursor:default}
.bubble-act svg{width:17px;height:17px;display:block}
/* Playing indicator: bars that rise and fall like a level meter. */
.wave{display:inline-flex;align-items:flex-end;gap:2px;height:17px}
.wave i{width:2.5px;background:currentColor;border-radius:1px;animation:wavebar .9s ease-in-out infinite}
.wave i:nth-child(1){height:6px;animation-delay:0s}
.wave i:nth-child(2){height:13px;animation-delay:.15s}
.wave i:nth-child(3){height:9px;animation-delay:.3s}
.wave i:nth-child(4){height:15px;animation-delay:.45s}
@keyframes wavebar{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.spin17{width:15px;height:15px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
.bubble-editor{width:100%;min-height:60px;border:1.5px solid var(--blue);border-radius:12px;padding:8px 11px;font:inherit;font-size:15px;line-height:1.45;resize:vertical;outline:none;background:#fff;color:var(--text)}
.bubble-edit-actions{display:flex;gap:8px;margin-top:6px}
.bubble-edit-actions button{border:0;border-radius:8px;padding:5px 13px;font-size:13px;font-weight:600;cursor:pointer}
.edit-save{background:var(--blue);color:#fff}
.edit-cancel{background:var(--surface2);color:var(--text2)}
#audio-unlock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));z-index:120;background:#1a1a2e;color:#fff;border:0;border-radius:22px;padding:11px 20px;font-size:14px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.28);cursor:pointer;display:flex;align-items:center;gap:8px}
#audio-unlock[hidden]{display:none}
.voice-bubble{align-self:flex-start;max-width:min(300px,88%);background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:9px 11px;display:flex;flex-direction:column;gap:6px}
.voice-bubble audio{width:100%;height:34px}
.voice-bubble-meta{font-size:11px;color:var(--text2);display:flex;align-items:center;gap:6px}
.voice-bubble-text{font-size:13px;line-height:1.4;color:var(--text);word-break:break-word}

/* UX polish merged from feat/leon-ux-polish */
#send-btn.ready{background:var(--blue);color:#fff}
#send-btn.ready:active{transform:scale(.92)}
.bubble.agent{white-space:normal;line-height:1.55}
.bubble.agent.streaming{white-space:pre-wrap}
.bubble.agent p{margin:.25em 0}
.bubble.agent p:first-child{margin-top:0}
.bubble.agent p:last-child{margin-bottom:0}
.bubble.agent h1,.bubble.agent h2,.bubble.agent h3{font-size:1em;font-weight:700;margin:.4em 0 .2em}
.bubble.agent ul,.bubble.agent ol{padding-left:1.4em;margin:.25em 0}
.bubble.agent li{margin:.1em 0}
.bubble.agent code{font-family:Menlo,monospace;font-size:13px;background:rgba(0,0,0,.06);border-radius:4px;padding:1px 5px}
.bubble.agent pre{background:rgba(0,0,0,.06);border-radius:8px;padding:10px 12px;overflow-x:auto;margin:.4em 0}
.bubble.agent pre code{background:none;padding:0;font-size:12px}
.bubble.agent blockquote{border-left:3px solid var(--border);padding-left:10px;color:var(--text2);margin:.3em 0}
.bubble.agent a{color:var(--blue);text-decoration:none}
.bubble.agent .markdown-image-link{display:block;margin:.45em 0;line-height:0}
.bubble.agent .markdown-image{display:block;width:auto;max-width:100%;max-height:60vh;object-fit:contain;border-radius:10px;border:1px solid var(--border);background:#fff;cursor:pointer}
.thinking-bubble{align-self:flex-start;display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:18px;border-bottom-left-radius:5px;padding:9px 14px;font-size:14px;color:var(--text2)}
.thinking-dots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--text2);margin:0 1.5px;animation:tdot .9s ease-in-out infinite}
.thinking-dots span:nth-child(2){animation-delay:.15s}
.thinking-dots span:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-4px);opacity:1}}
.thinking-timer{font-variant-numeric:tabular-nums;font-size:12px;opacity:.7;min-width:32px}
.tool-card{cursor:pointer;transition:border-color .15s}
.tool-card:hover{border-color:var(--blue)}
.tool-chevron{margin-left:auto;font-size:10px;color:var(--text2);transition:transform .2s}
.tool-card.open .tool-chevron{transform:rotate(180deg)}
.tool-detail{display:none;margin-top:8px;background:var(--surface);border-radius:8px;padding:8px 10px;font-size:12px;font-family:Menlo,monospace;color:var(--text2);white-space:pre-wrap;word-break:break-all;max-height:180px;overflow-y:auto}
.tool-card.open .tool-detail{display:block}
.error-card{align-self:flex-start;max-width:90%;background:var(--red-soft);border:1.5px solid var(--red);border-radius:12px;padding:10px 13px;display:flex;flex-direction:column;gap:6px}
.error-card-header{font-weight:600;font-size:14px;color:var(--red)}
.error-card-msg{font-size:13px;color:#7a2020;word-break:break-word;white-space:pre-wrap}
.error-retry-btn{align-self:flex-start;background:var(--red);color:#fff;border:none;border-radius:8px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer}
.image-card,.image-result{animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============================================================
   TIMELINE OVERLAY
   ============================================================ */
#timeline-overlay{
  position:fixed;inset:0;z-index:100;
  background:#0f1117;
  display:flex;flex-direction:column;
  opacity:0;pointer-events:none;
  transition:opacity .25s;
}
#timeline-overlay.open{opacity:1;pointer-events:all}

/* Timeline header */
#iv-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px 12px;
  padding-top:calc(16px + env(safe-area-inset-top));
  border-bottom:1px solid rgba(255,255,255,.08);
  flex-shrink:0;
}
#iv-title{color:#fff;font-size:18px;font-weight:700;letter-spacing:-.3px}
#iv-subtitle{color:rgba(255,255,255,.45);font-size:12px;margin-top:1px}
#iv-close{border:none;background:rgba(255,255,255,.1);color:#fff;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}

/* Runtime status row */
#iv-status-bar{
  display:flex;gap:8px;padding:10px 20px;
  border-bottom:1px solid rgba(255,255,255,.06);
  overflow-x:auto;flex-shrink:0;
}
.iv-stat{
  display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.06);border-radius:8px;
  padding:5px 10px;white-space:nowrap;
}
.iv-stat-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.iv-stat-dot.green{background:#46A171}
.iv-stat-dot.blue{background:#2783DE;animation:pulse 1.5s ease-in-out infinite}
.iv-stat-dot.gray{background:#555}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.iv-stat-label{font-size:11px;color:rgba(255,255,255,.5)}
.iv-stat-value{font-size:12px;color:#fff;font-weight:600}

/* Timeline scroll area */
#iv-timeline{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:16px 20px calc(20px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:0;
}
.tl-entry{
  display:flex;gap:12px;
}
.tl-line-col{
  display:flex;flex-direction:column;align-items:center;
  flex-shrink:0;width:24px;
}
.tl-dot{
  width:24px;height:24px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;flex-shrink:0;
}
.tl-connector{
  width:2px;flex:1;min-height:12px;
  background:rgba(255,255,255,.08);
  margin:2px 0;
}
.tl-body{flex:1;padding-bottom:16px}
.tl-label{
  font-size:11px;font-weight:600;letter-spacing:.04em;
  text-transform:uppercase;margin-bottom:4px;
}
.tl-content{
  border-radius:10px;padding:10px 12px;
  font-size:13px;line-height:1.5;
}
.tl-content code{
  font-family:Menlo,monospace;font-size:12px;
  background:rgba(255,255,255,.08);border-radius:4px;padding:1px 4px;
}
.tl-time{font-size:10px;color:rgba(255,255,255,.3);margin-top:4px}

/* Entry themes */
.tl-user .tl-dot{background:#2783DE}
.tl-user .tl-label{color:#5E9FE8}
.tl-user .tl-content{background:rgba(39,131,222,.12);color:#C8E0FF}

.tl-agent .tl-dot{background:#46A171}
.tl-agent .tl-label{color:#72BC8F}
.tl-agent .tl-content{background:rgba(70,161,113,.1);color:#B8DDCA;white-space:pre-wrap}

.tl-tool .tl-dot{background:#D5803B}
.tl-tool .tl-label{color:#DE9255}
.tl-tool .tl-content{background:rgba(213,128,59,.1);color:#F5C79A}

.tl-image .tl-dot{background:#7B5EA7}
.tl-image .tl-label{color:#B09FCC}
.tl-image .tl-content{background:rgba(123,94,167,.1)}
.tl-image img{width:100%;max-width:240px;border-radius:8px;display:block;margin-top:6px;cursor:pointer}

.tl-error .tl-dot{background:#E56458}
.tl-error .tl-label{color:#E97366}
.tl-error .tl-content{background:rgba(229,100,88,.1);color:#FFBBB6}

.tl-badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 7px;border-radius:20px;font-size:10px;font-weight:600;
  margin-left:6px;
}
.tl-badge.queued{background:rgba(255,255,255,.1);color:rgba(255,255,255,.5)}
.tl-badge.running{background:rgba(39,131,222,.25);color:#5E9FE8}
.tl-badge.completed{background:rgba(70,161,113,.25);color:#72BC8F}
.tl-badge.failed{background:rgba(229,100,88,.25);color:#E97366}
.tl-badge.cancelled{background:rgba(255,255,255,.1);color:rgba(255,255,255,.5)}

/* Bottom nav */
#nav{height:var(--nav-h);display:flex;border-top:1px solid var(--border);background:#fff;padding-bottom:env(safe-area-inset-bottom)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:none;cursor:pointer;color:var(--text2);font-size:10px;font-weight:500;padding:6px 0;transition:color .15s}
.nav-icon{font-size:22px;line-height:1}
.nav-item.active{color:var(--blue)}

/* Misc */
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text2);padding:32px}
.empty-icon{font-size:40px}
.empty-state p{font-size:14px;text-align:center}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
</style>
</head>
<body>

<!-- Login -->
<div id="login-screen">
  <div class="login-logo">⚡</div>
  <div class="login-title">Leon Agent</div>
  <div class="login-sub">AI 生图个人助手</div>
  <div class="login-field">
    <label>Token</label>
    <input id="login-token" type="password" placeholder="输入访问密钥…" autocomplete="current-password">
  </div>
  <div id="login-error"></div>
  <button id="login-btn">连接</button>
  <p class="login-hint">首次使用请输入服务端配置的 LEON_API_TOKEN。<br>未设置 Token 时直接点击连接即可。</p>
</div>

<!-- Main app -->
<div id="app">
  <div id="header">
    <h1>⚡ Leon Agent</h1>
    <div id="header-right">
      <button id="timeline-toggle">Timeline</button>
      <div id="status-wrap">
        <div id="status-dot"></div>
        <span id="status-label">未连接</span>
      </div>
    </div>
  </div>

  <div id="pages">
    <div class="page active" id="page-chat">
      <div id="chat-messages"></div>
      <div id="chat-input-wrap">

        <textarea id="chat-input" placeholder="输入消息…" rows="1" enterkeyhint="send" autocomplete="off"></textarea>
        <button id="send-btn" aria-label="发送" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="page" id="page-tasks"><div id="tasks-list"></div></div>
    <div class="page" id="page-gallery"><div id="gallery-grid"></div></div>

    <div class="page" id="page-settings">
      <div class="settings-section">
        <h3>模型</h3>
        <p class="settings-sub" id="model-current">加载当前模型…</p>
        <div class="settings-row">
          <input id="model-input" placeholder="输入或搜索模型 ID" autocomplete="off" spellcheck="false">
          <button id="model-refresh" type="button" aria-label="刷新模型列表" title="刷新模型列表">↻</button>

      <div class="settings-section" id="voice-section">

            <div class="settings-toggle-label">自动朗读每条回复</div>
            <div class="settings-toggle-hint">关闭后仍可点气泡上的 🔊，Agent 主动发的语音也照常播放</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="voice-autoplay-all"><span class="switch-track"></span>
          </label>
        </div>
        <div class="settings-row" style="margin-top:10px">
          <input id="voice-search" placeholder="搜索音色名 / 模型" autocomplete="off" spellcheck="false">
          <button id="voice-refresh" type="button" aria-label="刷新音色列表" title="刷新音色列表">↻</button>
        </div>
        <div id="voice-list" role="listbox" aria-label="音色"></div>
        <div id="voice-status" role="status" style="min-height:18px;margin-top:8px;font-size:12px;color:var(--text2)"></div>
      </div>
      <div class="debug-section">
        <button class="debug-btn" id="logout-btn">🔒 退出登录</button>
      </div>
    </div>
  </div>

  <nav id="nav">
    <button class="nav-item active" data-page="chat"><span class="nav-icon">💬</span>聊天</button>
    <button class="nav-item" data-page="tasks"><span class="nav-icon">📋</span>任务</button>
    <button class="nav-item" data-page="gallery"><span class="nav-icon">🖼️</span>图库</button>
    <button class="nav-item" data-page="settings"><span class="nav-icon">⚙️</span>设置</button>

</div>

<button id="audio-unlock" type="button" hidden>🔈 点击开启语音播放</button>

<div id="image-viewer" role="dialog" aria-modal="true" aria-label="图片预览" hidden>

    <img id="image-viewer-image" alt="图片预览">
  </div>
  <button id="image-viewer-close" class="iv-chrome" type="button" aria-label="关闭图片预览" title="关闭">×</button>
  <div id="image-viewer-counter" class="iv-chrome" hidden></div>
  <button id="image-viewer-prev" class="iv-chrome iv-nav" type="button" aria-label="上一张" title="上一张" hidden>‹</button>
  <button id="image-viewer-next" class="iv-chrome iv-nav" type="button" aria-label="下一张" title="下一张" hidden>›</button>
</div>

<!-- TIMELINE OVERLAY -->
<div id="timeline-overlay">
  <div id="iv-header">
    <div>
      <div id="iv-title">⚡ Leon Agent &mdash; Agent Timeline</div>
      <div id="iv-subtitle">Real-time decision trace</div>
    </div>
    <button id="iv-close">Close</button>
  </div>

  <div id="iv-status-bar">
    <div class="iv-stat">
      <div class="iv-stat-dot gray" id="iv-dot-sse"></div>
      <span class="iv-stat-label">SSE</span>
      <span class="iv-stat-value" id="iv-val-sse">--</span>
    </div>
    <div class="iv-stat">
      <div class="iv-stat-dot gray" id="iv-dot-session"></div>
      <span class="iv-stat-label">Session</span>
      <span class="iv-stat-value" id="iv-val-session">—</span>
    </div>
    <div class="iv-stat">
      <div class="iv-stat-dot gray" id="iv-dot-turns"></div>
      <span class="iv-stat-label">Turns</span>
      <span class="iv-stat-value" id="iv-val-turns">0</span>
    </div>
    <div class="iv-stat">
      <div class="iv-stat-dot gray" id="iv-dot-tools"></div>
      <span class="iv-stat-label">Tool Calls</span>
      <span class="iv-stat-value" id="iv-val-tools">0</span>
    </div>
    <div class="iv-stat">
      <div class="iv-stat-dot gray" id="iv-dot-images"></div>
      <span class="iv-stat-label">Images</span>

<script>
'use strict';
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function fmtTime(iso){try{return new Date(iso).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}catch{return iso}}

const BASE_URL = location.origin;
const TOKEN_KEY = 'leon_token', SESSION_KEY = 'leon_session';
let token = localStorage.getItem(TOKEN_KEY) || '';
let sessionId = localStorage.getItem(SESSION_KEY) || '';

// Login
const $loginScreen = document.getElementById('login-screen');
const $loginToken  = document.getElementById('login-token');
const $loginBtn    = document.getElementById('login-btn');
const $loginError  = document.getElementById('login-error');
function showLogin(err){$loginError.textContent=err||'';$loginScreen.classList.remove('hidden');setTimeout(()=>$loginToken.focus(),100)}
function hideLogin(){$loginScreen.classList.add('hidden')}
$loginToken.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doLogin()}})
$loginBtn.addEventListener('click',doLogin);
async function doLogin(){
  const t=$loginToken.value.trim();
  stopSSE();
  $loginBtn.disabled=true;$loginError.textContent='';
  try{
    const r=await fetch(BASE_URL+'/api/health',{headers:t?{Authorization:'Bearer '+t}:{}});
    if(!r.ok)throw new Error('Auth failed ('+r.status+')');
    token=t;sessionId='';localStorage.setItem(TOKEN_KEY,token);localStorage.removeItem(SESSION_KEY);
    hideLogin();await init();
  }catch(err){$loginError.textContent='❌ '+err.message}
  finally{$loginBtn.disabled=false}
}
document.getElementById('logout-btn').addEventListener('click',()=>{localStorage.removeItem(TOKEN_KEY);localStorage.removeItem(SESSION_KEY);location.reload()});

// Nav
document.querySelectorAll('.nav-item').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const t=btn.dataset.page;
    document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.page===t));
    document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id==='page-'+t));
    if(t==='tasks'){renderTasks();loadImageState()}
    if(t==='gallery'){renderGallery();loadImageState()}
    if(t==='settings'){loadModelSettings();loadVoiceCatalog()}
  });
});

// Status
const $dot=document.getElementById('status-dot'),$lbl=document.getElementById('status-label');
function setStatus(cls,label){$dot.className=cls;$lbl.textContent=label}

// API
async function api(method,path,body){
  const headers={'Content-Type':'application/json'};
  if(token)headers['Authorization']='Bearer '+token;
  const r=await fetch(BASE_URL+path,{method,headers,body:body?JSON.stringify(body):undefined});
  if(r.status===401){token='';localStorage.removeItem(TOKEN_KEY);stopSSE();showLogin('Token expired, please re-enter');throw new Error('401')}
  if(!r.ok)throw new Error(r.status+' '+await r.text());
  return r.json();
}

// Session model settings
const $modelInput=document.getElementById('model-input');
const $modelList=document.getElementById('model-list');
const $modelRefresh=document.getElementById('model-refresh');
const $modelSave=document.getElementById('model-save');
const $modelCurrent=document.getElementById('model-current');
const $modelStatus=document.getElementById('model-status');
let modelSettingsLoaded=false,modelCatalog=[],modelDefault='';
let modelListOpen=false;
function renderModelList(){
  $modelList.replaceChildren();
  if(!modelCatalog.length)return;
  // The candidate list is a picker, not a permanent panel: it opens while the
  // user is typing or browsing and collapses once a model is saved.
  if(!modelListOpen)return;
  const current=$modelInput.value.trim();
  const query=current.toLowerCase();
  const matches=modelCatalog.filter(id=>!query||id.toLowerCase().includes(query));
  if(!matches.length){
    const empty=document.createElement('div');empty.className='model-empty';
    empty.textContent='没有匹配的模型，也可以直接保存自定义 ID';
    $modelList.appendChild(empty);return;
  }
  matches.forEach(id=>{
    const button=document.createElement('button');
    button.type='button';button.setAttribute('role','option');
    button.className='model-option'+(id===current?' selected':'');
    button.innerHTML=`<span class="model-option-id">${esc(id)}</span>`+(id===modelDefault?'<span class="model-option-tag">默认</span>':'');
    button.addEventListener('click',()=>{$modelInput.value=id;renderModelList();$modelSave.disabled=false});
    $modelList.appendChild(button);
  });
  // The input doubles as the filter, so make it obvious when a half-typed query
  // would be saved verbatim as a custom model ID.
  if(current&&!modelCatalog.includes(current)){
    const note=document.createElement('div');note.className='model-empty';
    note.textContent='“'+current+'” 不在目录中，保存后按自定义 ID 使用';
    $modelList.appendChild(note);
  }
}
function fillModelSettings(data){
  modelCatalog=data.models||[];modelDefault=data.default_model||'';
  $modelInput.value=data.selected_model||'';
  $modelInput.placeholder='跟随默认 · '+data.default_model;
  $modelCurrent.textContent='当前：'+data.active_model+' · '+data.base_url;
  $modelStatus.className=data.catalog_error?'error':'';
  $modelStatus.textContent=data.catalog_error
    ?'目录拉取失败，仍可手动输入模型 ID：'+data.catalog_error
    :'共 '+modelCatalog.length+' 个可用模型，点击即可选择';
  renderModelList();modelSettingsLoaded=true;
}
async function loadModelSettings(refresh=false){
  if(!sessionId){$modelStatus.className='error';$modelStatus.textContent='会话尚未建立，请回聊天页等待连接后重试';return}
  $modelSave.disabled=true;$modelRefresh.disabled=true;$modelStatus.className='';
  $modelStatus.textContent=modelSettingsLoaded?'正在刷新…':'正在加载…';
  try{
    const suffix=refresh?'?refresh=true':'';
    fillModelSettings(await api('GET','/api/agent/sessions/'+sessionId+'/model'+suffix));
  }catch(err){
    $modelStatus.className='error';$modelStatus.textContent='加载失败：'+err.message;
  }finally{$modelSave.disabled=false;$modelRefresh.disabled=false}
}
async function saveModelSettings(){
  if(!sessionId)return;
  $modelSave.disabled=true;$modelStatus.className='';$modelStatus.textContent='正在保存…';
  try{
    const model=$modelInput.value.trim();
    fillModelSettings(await api('PUT','/api/agent/sessions/'+sessionId+'/model',{model:model||null}));
    $modelStatus.textContent='已保存，下条消息开始使用';
    modelListOpen=false;renderModelList();
  }catch(err){
    $modelStatus.className='error';$modelStatus.textContent='保存失败：'+err.message;
  }finally{$modelSave.disabled=false}
}
$modelInput.addEventListener('input',()=>{modelListOpen=true;renderModelList()});
$modelInput.addEventListener('focus',()=>{modelListOpen=true;renderModelList()});
$modelSave.addEventListener('click',saveModelSettings);
$modelRefresh.addEventListener('click',()=>{modelListOpen=true;loadModelSettings(true)});

// SSE
let sse=null,sseTimer=null;
function stopSSE(){
  clearTimeout(sseTimer);sseTimer=null;
  if(sse){sse.close();sse=null}
}
function connectSSE(){
  if(!sessionId)return;
  stopSSE();setStatus('connecting','Connecting...');
  const url=BASE_URL+'/api/agent/sessions/'+sessionId+'/events'+(token?'?token='+encodeURIComponent(token):'');
  sse=new EventSource(url);
  sse.onopen=()=>setStatus('online','Connected');
  sse.onerror=()=>{sse.close();sse=null;setStatus('error','Disconnected');sseTimer=setTimeout(connectSSE,3000)}
  sse.onmessage=e=>{try{handleEvent(JSON.parse(e.data))}catch{}}
}
window.addEventListener('online',()=>{clearTimeout(sseTimer);sseTimer=setTimeout(connectSSE,500)})

// State
const tasks={},images={};
let currentToolCard=null,currentBubble=null,sending=false;
let ivTurns=0,ivTools=0;
let currentMessageId=null;
let streamBuffer='',lastUserText='',lastAgentErrorAt=0;

function safeHref(value){
  try{
    const url=new URL(value,location.origin);
    return ['http:','https:'].includes(url.protocol)?url.href:'';
  }catch{return ''}
}
function isImageHref(value){
  try{
    const url=new URL(value,location.origin);
    const candidates=[url.pathname,url.searchParams.get('filename')||'',url.searchParams.get('file')||''];
    return candidates.some(candidate=>/\.(?:avif|bmp|gif|jpe?g|png|webp)$/i.test(decodeURIComponent(candidate)));
  }catch{return false}
}
// ---- Fullscreen image album viewer ----
const $imageViewer=document.getElementById('image-viewer');
const $imageViewerImage=document.getElementById('image-viewer-image');
const $ivStage=document.getElementById('image-viewer-stage');
const $ivCounter=document.getElementById('image-viewer-counter');
const $ivPrev=document.getElementById('image-viewer-prev');
const $ivNext=document.getElementById('image-viewer-next');
const IV_MAX_SCALE=6,IV_SWIPE_RATIO=.55,IV_SWIPE_THRESHOLD=60;
const IV_SCOPES=['#chat-messages','#gallery-grid','#iv-timeline'];
const viewerPointers=new Map();
let viewerScale=1,viewerX=0,viewerY=0,ivSwipeDX=0;
let viewerPanStart=null,viewerPinchStart=null,viewerSwipe=null,ivMoved=false,ivLastTap=0;
let ivAlbum=[],ivIndex=0;

// Clamp against the full viewport so a zoomed image can be dragged edge to edge.
function ivClampOffsets(){
  if(viewerScale<=1){viewerScale=1;viewerX=0;viewerY=0;return}
  const maxX=Math.max(0,($imageViewerImage.clientWidth*viewerScale-$imageViewer.clientWidth)/2);
  const maxY=Math.max(0,($imageViewerImage.clientHeight*viewerScale-$imageViewer.clientHeight)/2);
  viewerX=Math.max(-maxX,Math.min(maxX,viewerX));
  viewerY=Math.max(-maxY,Math.min(maxY,viewerY));
}
function applyViewerTransform(){
  ivClampOffsets();
  $imageViewerImage.style.transform=`translate3d(${viewerX+ivSwipeDX}px,${viewerY}px,0) scale(${viewerScale})`;
}
// Pin the content point under (focalX,focalY) while the scale changes:
// with screen(p)=center+p*s+offset, holding screen(p) fixed gives
// offset' = d - (d - offset) * (s'/s), where d = focal - center.
function zoomAt(nextScale,focalX,focalY){
  const target=Math.max(1,Math.min(IV_MAX_SCALE,nextScale));
  const ratio=target/viewerScale;
  if(ratio===1)return;
  const rect=$imageViewerImage.getBoundingClientRect();
  const dx=focalX-(rect.left+rect.width/2-viewerX-ivSwipeDX);
  const dy=focalY-(rect.top+rect.height/2-viewerY);
  viewerX=dx-(dx-viewerX)*ratio;
  viewerY=dy-(dy-viewerY)*ratio;
  viewerScale=target;
  applyViewerTransform();
}
function zoomFromCenter(factor){
  const rect=$imageViewer.getBoundingClientRect();
  zoomAt(viewerScale*factor,rect.left+rect.width/2,rect.top+rect.height/2);
}
function resetViewerZoom(){
  viewerScale=1;viewerX=0;viewerY=0;ivSwipeDX=0;
  viewerPointers.clear();viewerPanStart=null;viewerPinchStart=null;viewerSwipe=null;
  applyViewerTransform();
}
function ivRenderChrome(){
  const many=ivAlbum.length>1;
  $ivPrev.hidden=!many;$ivNext.hidden=!many;$ivCounter.hidden=!many;
  if(many)$ivCounter.textContent=(ivIndex+1)+' / '+ivAlbum.length;
}
function ivShow(index){
  if(!ivAlbum.length)return;
  ivIndex=(index%ivAlbum.length+ivAlbum.length)%ivAlbum.length;
  $imageViewerImage.classList.remove('iv-settling');
  resetViewerZoom();
  const item=ivAlbum[ivIndex];
  $imageViewerImage.src=item.href;
  $imageViewerImage.alt=item.alt||'图片预览';
  ivRenderChrome();
}
function ivGo(step){if(ivAlbum.length>1)ivShow(ivIndex+step)}
// The album is whatever surface the user tapped from, in the order they see it.
function collectAlbum(trigger){
  if(!trigger)return null;
  let root=null;
  for(const selector of IV_SCOPES){
    const node=document.querySelector(selector);
    if(node&&node.contains(trigger)){root=node;break}
  }
  if(!root)return null;
  const seen=new Set(),album=[];
  root.querySelectorAll('img').forEach(img=>{
    const href=safeHref(img.currentSrc||img.src||'');
    if(!href||seen.has(href))return;
    seen.add(href);album.push({href,alt:img.alt||'图片预览'});
  });
  return album.length?album:null;
}
function openImageViewer(value,alt='图片预览',trigger=null){
  const href=safeHref(value);if(!href)return;
  const album=collectAlbum(trigger);
  const found=album?album.findIndex(item=>item.href===href):-1;
  if(album&&found>=0){ivAlbum=album;ivIndex=found}
  else if(album){ivAlbum=[{href,alt},...album];ivIndex=0}
  else{ivAlbum=[{href,alt}];ivIndex=0}
  $imageViewer.hidden=false;
  ivShow(ivIndex);
}
function closeImageViewer(){
  $imageViewer.hidden=true;$imageViewerImage.removeAttribute('src');
  ivAlbum=[];ivIndex=0;resetViewerZoom();
}
document.getElementById('image-viewer-close').addEventListener('click',closeImageViewer);
$ivPrev.addEventListener('click',()=>ivGo(-1));
$ivNext.addEventListener('click',()=>ivGo(1));
$imageViewer.addEventListener('click',e=>{if(e.target===$imageViewer||e.target===$ivStage)closeImageViewer()});
$imageViewerImage.addEventListener('load',applyViewerTransform);
document.addEventListener('keydown',e=>{
  if($imageViewer.hidden)return;
  if(e.key==='Escape')closeImageViewer();
  else if(e.key==='ArrowLeft')ivGo(-1);
  else if(e.key==='ArrowRight')ivGo(1);
  else if(e.key==='+'||e.key==='=')zoomFromCenter(1.25);
  else if(e.key==='-')zoomFromCenter(1/1.25);
  else if(e.key==='0')resetViewerZoom();
});
$imageViewerImage.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  e.preventDefault();
  $imageViewerImage.classList.remove('iv-settling');
  $imageViewerImage.setPointerCapture(e.pointerId);
  viewerPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(viewerPointers.size===1){
    ivMoved=false;
    viewerPanStart={x:e.clientX,y:e.clientY,baseX:viewerX,baseY:viewerY};
    viewerSwipe=viewerScale<=1?{x:e.clientX,y:e.clientY,locked:null}:null;
  }else{
    viewerSwipe=null;ivSwipeDX=0;ivMoved=true;
    const [a,b]=[...viewerPointers.values()];
    viewerPinchStart={distance:Math.hypot(a.x-b.x,a.y-b.y),scale:viewerScale};
  }
});
$imageViewerImage.addEventListener('pointermove',e=>{
  if(!viewerPointers.has(e.pointerId))return;
  viewerPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(viewerPointers.size>=2&&viewerPinchStart){
    const [a,b]=[...viewerPointers.values()];
    const distance=Math.hypot(a.x-b.x,a.y-b.y);
    ivMoved=true;
    zoomAt(viewerPinchStart.scale*distance/Math.max(1,viewerPinchStart.distance),(a.x+b.x)/2,(a.y+b.y)/2);
    return;
  }
  if(viewerPointers.size!==1)return;
  if(viewerScale>1&&viewerPanStart){
    ivMoved=true;
    viewerX=viewerPanStart.baseX+e.clientX-viewerPanStart.x;
    viewerY=viewerPanStart.baseY+e.clientY-viewerPanStart.y;
    applyViewerTransform();return;
  }
  if(viewerSwipe&&ivAlbum.length>1){
    const dx=e.clientX-viewerSwipe.x,dy=e.clientY-viewerSwipe.y;
    if(viewerSwipe.locked===null&&(Math.abs(dx)>8||Math.abs(dy)>8))viewerSwipe.locked=Math.abs(dx)>Math.abs(dy);
    if(viewerSwipe.locked){ivMoved=true;ivSwipeDX=dx*IV_SWIPE_RATIO;applyViewerTransform()}
  }
});
function endViewerPointer(e){
  if(!viewerPointers.has(e.pointerId))return;
  viewerPointers.delete(e.pointerId);
  if(viewerPointers.size<2)viewerPinchStart=null;
  if(viewerSwipe&&viewerSwipe.locked){
    const travelled=ivSwipeDX/IV_SWIPE_RATIO;
    ivSwipeDX=0;
    if(Math.abs(travelled)>IV_SWIPE_THRESHOLD){
      ivGo(travelled<0?1:-1);
      viewerSwipe=null;viewerPanStart=null;return;
    }
    $imageViewerImage.classList.add('iv-settling');applyViewerTransform();
    setTimeout(()=>$imageViewerImage.classList.remove('iv-settling'),240);
  }
  const remaining=[...viewerPointers.values()][0];
  viewerPanStart=remaining?{x:remaining.x,y:remaining.y,baseX:viewerX,baseY:viewerY}:null;
  viewerSwipe=remaining&&viewerScale<=1?{x:remaining.x,y:remaining.y,locked:null}:null;
  if(!remaining&&!ivMoved&&e.pointerType!=='mouse'){
    const now=Date.now();
    if(now-ivLastTap<300){ivLastTap=0;if(viewerScale>1)resetViewerZoom();else zoomAt(2.5,e.clientX,e.clientY)}
    else ivLastTap=now;
  }
}
$imageViewerImage.addEventListener('pointerup',endViewerPointer);
$imageViewerImage.addEventListener('pointercancel',endViewerPointer);
$imageViewerImage.addEventListener('dblclick',e=>{
  e.preventDefault();
  if(viewerScale>1)resetViewerZoom();else zoomAt(2.5,e.clientX,e.clientY);
});
$imageViewer.addEventListener('wheel',e=>{e.preventDefault();zoomAt(viewerScale*(e.deltaY<0?1.15:.87),e.clientX,e.clientY)},{passive:false});

function renderInline(raw){
  const tokens=[];
  const token=html=>{tokens.push(html);return '\u0000'+(tokens.length-1)+'\u0000'};
  let text=String(raw)
    .replace(/`([^`]+)`/g,(_,code)=>token('<code>'+esc(code)+'</code>'))
    .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,(_,label,url)=>{
      const href=safeHref(url);
      return href?token('<a class="markdown-image-link" href="'+esc(href)+'"><img class="markdown-image" src="'+esc(href)+'" alt="'+esc(label||'图片')+'" loading="lazy"></a>'):esc(label||'图片');
    })
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(_,label,url)=>{
      const href=safeHref(url);
      return href?token('<a href="'+esc(href)+'" target="_blank" rel="noopener">'+esc(label)+'</a>'):label;
    })
    .replace(/https?:\/\/[^\s<>"']+/gi,raw=>{
      const value=raw.replace(/[.,;!?，。；！？）]+$/,'');
      const suffix=raw.slice(value.length);
      const href=safeHref(value);
      if(!href||!isImageHref(href))return raw;
      return token('<a class="markdown-image-link" href="'+esc(href)+'"><img class="markdown-image" src="'+esc(href)+'" alt="生成图片" loading="lazy"></a>')+suffix;
    });
  text=esc(text)
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g,'<em>$1</em>');
  return text.replace(/\u0000(\d+)\u0000/g,(_,index)=>tokens[Number(index)]||'');
}
function renderMd(raw){
  const lines=String(raw||'').split(/\r?\n/);
  const html=[];let inCode=false,code=[],inList=false;
  const closeList=()=>{if(inList){html.push('</ul>');inList=false}};
  for(const line of lines){
    if(line.startsWith('```')){
      if(inCode){html.push('<pre><code>'+esc(code.join('\n'))+'</code></pre>');code=[];inCode=false}
      else{closeList();inCode=true}
      continue;
    }
    if(inCode){code.push(line);continue}
    const item=line.match(/^\s*[-*]\s+(.+)$/);
    if(item){if(!inList){html.push('<ul>');inList=true}html.push('<li>'+renderInline(item[1])+'</li>');continue}
    closeList();
    if(!line.trim())continue;
    const heading=line.match(/^#{1,3}\s+(.+)$/);
    if(heading){html.push('<h3>'+renderInline(heading[1])+'</h3>');continue}
    const quote=line.match(/^>\s?(.*)$/);
    if(quote){html.push('<blockquote>'+renderInline(quote[1])+'</blockquote>');continue}
    html.push('<p>'+renderInline(line)+'</p>');
  }
  closeList();
  if(inCode)html.push('<pre><code>'+esc(code.join('\n'))+'</code></pre>');
  return html.join('');
}

let audioUnlocked=false,audioUnlockPromise=null,activeVoice=null,pendingVoice=null;
async function unlockAudio(){
  if(audioUnlocked)return true;
  if(!audioUnlockPromise){
    audioUnlockPromise=(async()=>{
      try{
        voicePlayer.src=SILENT_MP3;
        await voicePlayer.play();
        voicePlayer.pause();voicePlayer.currentTime=0;
        audioUnlocked=true;$audioUnlock.hidden=true;
      }catch{}
      return audioUnlocked;
    })();
  }
  try{return await audioUnlockPromise}
  finally{audioUnlockPromise=null}
}

async function playVoice(url,{onState}={}){
  if(activeVoice){
    const previous=activeVoice;activeVoice=null;voicePlayer.pause();
    if(previous.onState)previous.onState('idle');
  }
  const token={};activeVoice={token,onState};
  voicePlayer.src=url;
  const done=()=>{
    if(activeVoice&&activeVoice.token===token){activeVoice=null;if(onState)onState('idle')}
  };
  voicePlayer.onended=done;voicePlayer.onpause=()=>{if(voicePlayer.ended)done()};
  try{
    await voicePlayer.play();
    if(onState)onState('playing');
    return true;
  }catch(err){
    if(activeVoice&&activeVoice.token===token)activeVoice=null;
    // NotAllowedError == the browser wants a user gesture (iOS Chrome).
    if(err&&err.name==='NotAllowedError'){
      if(pendingVoice&&pendingVoice.onState)pendingVoice.onState('idle');
      pendingVoice={url,onState};$audioUnlock.hidden=false;
      return false;
    }
    if(onState)onState('idle');
    return false;
  }
}
function stopVoice(){
  if(pendingVoice){

    if(waiting.onState)waiting.onState('idle');
  }
  if(activeVoice){
    const current=activeVoice;activeVoice=null;voicePlayer.pause();voicePlayer.currentTime=0;
    if(current.onState)current.onState('idle');
  }
  $audioUnlock.hidden=true;
}

function speakableText(raw){

    .replace(/\r\n?/g,'\n')
    .replace(/```[\s\S]*?```/g,' ')
    .replace(/!\[[^\]]*\]\([^)]*\)/g,' ')
    .replace(/\[([^\]]+)\]\([^)]*\)/g,'$1')
    .replace(/https?:\/\/\S+/gi,' ')
    .replace(/\s*(?:提交信息|详细信息|任务信息)\s*[:：]\s*(?=\n|$)/g,'')
    .replace(/(?:(?:任务|生成计划|客户端任务)\s*(?:ID|编号)|(?:job|generation\s+plan|client\s+task)\s*id)\s*[:：]\s*[A-Za-z0-9_-]+/gi,' ')
    .replace(/[（(]\s*(?=[A-Za-z0-9_-]*[_\d])[A-Za-z0-9][A-Za-z0-9_-]{5,}\s*[）)]/g,' ')
    .replace(/\b[a-fA-F0-9]{16,}\b/g,' ')
    .replace(/\b[A-Za-z][A-Za-z0-9_-]{19,}\b/g,' ')
    .replace(/[\u{1F000}-\u{1FAFF}\u2600-\u27BF\uFE0E\uFE0F\u200D]/gu,' ')
    .replace(/^\s*(?:[-*+•]\s+|[-–—]{2,}\s*$)/gm,'')
    .replace(/[`*_>#|~]/g,'')
    .split('\n')
    .map(line=>line.replace(/[ \t]+/g,' ').replace(/([\u3400-\u9fff」』）]) (?=[\u3400-\u9fff「『（])/g,'$1').replace(/^[ ，]+|[ ，]+$/g,''))
    .filter(Boolean)
    .join('，')
    .replace(/，{2,}/g,'，')
    .replace(/^[ ，]+|[ ，]+$/g,'');
}

async function requestTts(text){
  const headers={'Content-Type':'application/json'};
  if(token)headers['Authorization']='Bearer '+token;
  const r=await fetch(BASE_URL+'/api/agent/tts',{method:'POST',headers,
    body:JSON.stringify({text,voice_id:activeVoiceId()||undefined})});
  if(!r.ok){
    const contentType=r.headers.get('content-type')||'';
    let detail='';
    if(contentType.includes('application/json')){
      const payload=await r.json();detail=String(payload.detail||payload.error||'').trim();
    }else{
      const body=(await r.text()).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
      detail=body.slice(0,160);
    }
    throw new Error(detail||`TTS ${r.status}${r.statusText?' '+r.statusText:''}`);
  }
  return URL.createObjectURL(await r.blob());
}
async function speakMessage(msg,button){
  if(!voiceState.enabled)return;
  if(button.classList.contains('busy')){stopVoice();button.classList.remove('busy');button.innerHTML=ICON_SPEAK;return}
  const spoken=speakableText(msg.text);
  if(!spoken){button.title='没有可朗读的文字';return}
  // Unlock inside the click itself; awaiting fetch first can lose the gesture.
  unlockAudio();
  button.classList.add('busy');button.innerHTML=ICON_LOADING;
  try{
    const url=await requestTts(spoken);
    button.innerHTML=ICON_WAVE;
    await playVoice(url,{onState:state=>{
      if(state==='idle'){button.classList.remove('busy');button.innerHTML=ICON_SPEAK;URL.revokeObjectURL(url)}
    }});
  }catch(err){

function startEditingMessage(msg){
  const node=messageNode(msg.id);if(!node)return;
  const bubble=node.querySelector('.bubble');if(!bubble)return;
  if(node.querySelector('.bubble-editor'))return;
  const original=msg.text;
  const editor=document.createElement('textarea');
  editor.className='bubble-editor';editor.value=original;
  const actions=document.createElement('div');actions.className='bubble-edit-actions';
  const save=document.createElement('button');save.type='button';save.className='edit-save';save.textContent='保存';
  const cancel=document.createElement('button');cancel.type='button';cancel.className='edit-cancel';cancel.textContent='取消';
  actions.append(save,cancel);
  bubble.replaceWith(editor);node.insertBefore(actions,node.querySelector('.bubble-toolbar'));
  editor.focus();editor.setSelectionRange(editor.value.length,editor.value.length);
  editor.style.height='auto';editor.style.height=Math.min(editor.scrollHeight,260)+'px';
  editor.addEventListener('input',()=>{editor.style.height='auto';editor.style.height=Math.min(editor.scrollHeight,260)+'px'});
  const finish=commit=>{
    if(commit)msg.text=editor.value;
    actions.remove();
    // Re-render from the store so the toolbar (and 🔊) picks up the new text.
    patchMessage(msg.id);
  };
  save.addEventListener('click',()=>finish(true));
  cancel.addEventListener('click',()=>finish(false));
  editor.addEventListener('keydown',e=>{
    if(e.key==='Escape'){e.preventDefault();finish(false)}
    if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();finish(true)}
  });
}

let twQueue=[],twBubble=null,twFrame=null,twFinalText=null;
function twReset(){
  if(twFrame)cancelAnimationFrame(twFrame);
  if(twBubble&&twFinalText!==null){
    twBubble.classList.remove('streaming');twBubble.innerHTML=renderMd(twFinalText);
  }
  twQueue=[];twBubble=null;twFrame=null;twFinalText=null;
}
function twEnqueue(text,bubble){
  twBubble=bubble;twQueue.push(...Array.from(text));
  if(!twFrame)twFrame=requestAnimationFrame(twTick);
}
function twTick(){
  twFrame=null;
  if(twBubble&&twQueue.length){
    const count=Math.min(2,twQueue.length);
    for(let i=0;i<count;i++)twBubble.textContent+=twQueue.shift();
    scrollBottom();twFrame=requestAnimationFrame(twTick);return;
  }
  if(twBubble&&twFinalText!==null){
    twBubble.classList.remove('streaming');twBubble.innerHTML=renderMd(twFinalText);twFinalText=null;scrollBottom();
  }
}
function twComplete(finalText,bubble){
  twBubble=bubble;twFinalText=finalText;
  if(!twFrame)twFrame=requestAnimationFrame(twTick);
}

const messages=[],messageIndex=new Map();
let messageSeq=0;
function newMessageId(){messageSeq+=1;return 'm_'+Date.now().toString(36)+'_'+messageSeq}
function getMessage(id){return id?messageIndex.get(id)||null:null}
function messageNode(id){return id?$msgs.querySelector('[data-message-id="'+id+'"]'):null}
function createMessage(init){
  const msg={id:newMessageId(),kind:'text',role:'agent',text:'',status:'done',images:[],
    meta:{model:null,startedAt:Date.now(),finishedAt:null,elapsedMs:null,tokensIn:null,tokensOut:null},
    audio:{state:'idle',url:null},...init};
  messages.push(msg);messageIndex.set(msg.id,msg);
  $msgs.appendChild(renderMessage(msg));scrollBottom();return msg;
}
function removeMessage(id){
  const msg=getMessage(id);if(!msg)return;
  const node=messageNode(id);if(node&&node.isConnected)node.remove();
  messageIndex.delete(id);
  const at=messages.indexOf(msg);if(at>=0)messages.splice(at,1);
}
function renderMessage(msg){
  if(msg.kind==='error'){
    const node=renderBubbleBody(msg);node.dataset.messageId=msg.id;
    const errorBar=renderBubbleToolbar(msg);if(errorBar)node.appendChild(errorBar);
    return node;
  }
  const wrap=document.createElement('div');
  wrap.className='bubble-wrap '+msg.role+(msg.kind==='image'?' image-result':'');
  wrap.dataset.messageId=msg.id;
  wrap.appendChild(renderBubbleBody(msg));
  const bar=renderBubbleToolbar(msg);if(bar)wrap.appendChild(bar);
  return wrap;
}
function renderBubbleBody(msg){
  if(msg.kind==='error'){
    const card=document.createElement('div');card.className='error-card';
    card.innerHTML=`<div class="error-card-header">请求失败</div><div class="error-card-msg">${esc(msg.text)}</div>`;
    return card;
  }
  const bubble=document.createElement('div');
  bubble.className='bubble '+msg.role+(msg.status==='streaming'?' streaming':'');
  if(msg.kind==='image')bubble.innerHTML=msg.images.map(href=>renderMd(`![生成图片](${href})`)).join('');
  else if(msg.role==='agent'&&msg.status!=='streaming')bubble.innerHTML=renderMd(msg.text);
  else bubble.textContent=msg.text;
  return bubble;
}
function retryMessage(msg){
  const at=messages.indexOf(msg);let text='';
  for(let i=(at>=0?at:messages.length)-1;i>=0;i--){
    const candidate=messages[i];
    if(candidate.role==='user'&&candidate.kind==='text'&&candidate.text.trim()){
      text=candidate.text.trim();break;
    }
  }
  if(!text)text=lastUserText;
  if(!text||sending||!sessionId)return;
  $input.value=text;updateComposerState();sendMessage();
}
function renderBubbleToolbar(msg){
  if(msg.kind==='error'){
    const bar=document.createElement('div');bar.className='bubble-toolbar';
    const retry=document.createElement('button');
    retry.type='button';retry.className='error-retry-btn';retry.textContent='重试';
    retry.addEventListener('click',()=>retryMessage(msg));
    bar.appendChild(retry);return bar;
  }
  if(msg.role!=='agent'||msg.kind!=='text'||msg.status!=='done'||!msg.text.trim())return null;
  const bar=document.createElement('div');bar.className='bubble-toolbar';
  const mk=(label,title,handler)=>{
    const b=document.createElement('button');
    b.type='button';b.className='bubble-act';b.title=title;b.innerHTML=label;
    b.addEventListener('click',()=>handler(b));return b;
  };
  bar.appendChild(mk(ICON_COPY,'复制',async b=>{
    try{await navigator.clipboard.writeText(msg.text)}
    catch{
      const ta=document.createElement('textarea');ta.value=msg.text;ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();
    }
    b.classList.add('ok');b.innerHTML=ICON_CHECK;
    setTimeout(()=>{b.classList.remove('ok');b.innerHTML=ICON_COPY},1400);
  }));
  bar.appendChild(mk(ICON_RETRY,'重试',()=>retryMessage(msg)));
  bar.appendChild(mk(ICON_EDIT,'编辑',()=>startEditingMessage(msg)));
  if(voiceState.enabled){
    const speak=mk(ICON_SPEAK,'朗读',b=>speakMessage(msg,b));
    speak.classList.add('bubble-speak');bar.appendChild(speak);
  }
  return bar;
}
function patchMessage(id){
  const msg=getMessage(id),node=messageNode(id);if(!msg||!node)return null;
  const next=renderMessage(msg),loaded=new Map();
  // Reuse already decoded <img> nodes so a status patch never restarts a download.
  node.querySelectorAll('img').forEach(img=>{if(img.complete&&!loaded.has(img.src))loaded.set(img.src,img)});
  next.querySelectorAll('img').forEach(img=>{const old=loaded.get(img.src);if(old)img.replaceWith(old)});
  node.replaceWith(next);return next;
}

function replaceSkeletonWithImage(jobId,url){
  const href=safeHref(url);if(!href)return;
  const preload=new Image();let settled=false;
  // The tool card already shows progress; the completed image becomes a fresh
  // bubble at the bottom instead of occupying a temporary placeholder.
  const show=()=>{
    if(settled)return;settled=true;
    const msg=createMessage({kind:'image',status:'done',images:[href]});
    // This is what the user has been waiting for, so jump to it even if they
    // scrolled away, then re-anchor once the <img> reports its real height.
    autoFollowMessages=true;scrollBottom(true);
    const node=messageNode(msg.id),image=node&&node.querySelector('img');
    if(image&&!image.complete)image.addEventListener('load',()=>scrollBottom(true),{once:true});
    else requestAnimationFrame(()=>scrollBottom(true));
  };
  preload.addEventListener('load',show,{once:true});preload.addEventListener('error',show,{once:true});preload.src=href;
}
function addErrorCard(message){
  return createMessage({kind:'error',status:'error',text:message});
}

function statusKey(status){
  const value=String(status||'').trim().toLowerCase();
  if(value==='queued'||value==='pending')return 'queued';
  if(value==='running'||value==='processing')return 'running';
  if(value==='completed'||value==='done'||value==='success')return 'completed';
  if(value==='failed'||value==='error')return 'failed';
  if(value==='cancelled'||value==='canceled')return 'cancelled';
  return value||'queued';
}
function statusLabel(status){
  return {queued:'排队中',running:'生成中',completed:'已完成',failed:'失败',cancelled:'已取消'}[statusKey(status)]||String(status||'未知');
}

// ============================================================
// Event handler
// ============================================================
function handleEvent(ev){
  updateIvStats();
  switch(ev.event){
    case 'session.connected':setStatus('online','Connected');break;

    case 'user.message':
      ivTurns++;addTlEntry('user','User Input',esc(ev.data.content||''),ev.timestamp);updateIvStats();break;

    case 'assistant.started':
      showThinking();currentBubble=null;currentMessageId=null;currentToolCard=null;currentIvToolEntry=null;
      streamBuffer='';twReset();break;

    case 'assistant.delta':{
      const delta=ev.data.delta||'';if(!delta)break;
      hideThinking();
      if(!currentBubble){const started=addMessageBubble('agent','',true);currentMessageId=started.msg.id;currentBubble=started.node}
      const bubble=currentBubble.querySelector('.bubble');
      const streaming=getMessage(currentMessageId);if(streaming)streaming.text+=delta;
      streamBuffer+=delta;twEnqueue(delta,bubble);break;
    }

    case 'assistant.completed':{
      const content=ev.data.content||'';
      hideThinking();
      if(!currentBubble){const started=addMessageBubble('agent','',true);currentMessageId=started.msg.id;currentBubble=started.node}
      const bubble=currentBubble.querySelector('.bubble');
      if(!streamBuffer&&content)twEnqueue(content,bubble);
      twComplete(content||streamBuffer,bubble);
      const finished=getMessage(currentMessageId);
      if(finished){
        finished.text=content||streamBuffer;finished.status='done';
        finished.meta.model=ev.data.model||finished.meta.model;
        finished.meta.finishedAt=Date.now();
        finished.meta.elapsedMs=finished.meta.finishedAt-finished.meta.startedAt;
        // The bubble was rendered while streaming, so re-render to attach 🔊.
        patchMessage(finished.id);
        if(voiceState.enabled&&voicePrefs.autoplayAll&&finished.text.trim())autoSpeak(finished);
      }
      currentBubble=null;currentMessageId=null;
      if(content)addTlEntry('agent','Agent Response',esc(content),ev.timestamp);
      break;
    }

    case 'assistant.notice':{
      const content=ev.data.content||'';
      if(content){addBubble('agent',content,false);addTlEntry('agent','Agent Notice',esc(content),ev.timestamp)}
      break;
    }

    case 'tool.started':
      hideThinking();
      ivTools++;currentToolCard=addToolCard(ev.data.tool_name,'running',ev.data.input);scrollBottom();
      currentIvToolEntry=addTlEntry('tool','工具调用',`正在调用 <code>${esc(ev.data.tool_name)}</code><span class="tl-badge running">${statusLabel('running')}</span>`,ev.timestamp);
      updateIvStats();break;

    case 'tool.finished':{
      const ok=ev.data.ok!==false;
      if(currentToolCard)updateToolCard(currentToolCard,ok?'done':'failed',ev.data.output);
      if(currentIvToolEntry){const status=ok?'completed':'failed',b=currentIvToolEntry.querySelector('.tl-badge');if(b){b.className='tl-badge '+status;b.textContent=statusLabel(status)}}
      break;
    }

    case 'image.task.created':
      tasks[ev.data.job_id]={
        status:ev.data.status||'queued',planId:ev.data.generation_plan_id,
        modeId:ev.data.mode_id||'',modeName:ev.data.mode_name||'',sourceText:ev.data.source_text||''
      };
      if(currentToolCard)addTaskMeta(currentToolCard,ev.data);
      if(currentIvToolEntry){
        const c=currentIvToolEntry.querySelector('.tl-content');
        const row=document.createElement('div');row.style.marginTop='4px';
        const status=statusKey(ev.data.status);
        row.innerHTML=`${esc(ev.data.mode_name||ev.data.mode_id||'生图任务')}<span class="tl-badge ${status}" id="iv-badge-${esc(ev.data.job_id)}">${statusLabel(status)}</span>`;
        c.appendChild(row);
      }
      break;

    case 'image.task.updated':
      if(tasks[ev.data.job_id])tasks[ev.data.job_id].status=ev.data.status;
      if(currentToolCard)updateBadge(currentToolCard,ev.data.job_id,ev.data.status);
      {const status=statusKey(ev.data.status),ivb=document.getElementById('iv-badge-'+ev.data.job_id);if(ivb){ivb.className='tl-badge '+status;ivb.textContent=statusLabel(status)}}
      break;

    case 'image.completed':
      tasks[ev.data.job_id]={...(tasks[ev.data.job_id]||{}),status:'completed'};
      images[ev.data.job_id]={url:ev.data.image_url};
      replaceSkeletonWithImage(ev.data.job_id,ev.data.image_url);
      {const href=safeHref(ev.data.image_url);if(href)addTlEntry('image','Image Ready',`<a href="${esc(href)}" data-image-preview="${esc(href)}" style="color:#B09FCC">查看大图<br><img src="${esc(href)}" alt="generated"></a>`,ev.timestamp)}
      updateIvStats();break;

    case 'voice.ready':
      addVoiceBubble(ev.data||{});
      addTlEntry('agent','Voice',esc((ev.data&&ev.data.text)||''),ev.timestamp);
      break;

    case 'agent.error':{
      const msg=ev.data.error||'Unknown error';
      hideThinking();twReset();lastAgentErrorAt=Date.now();
      if(currentBubble){removeMessage(currentMessageId);currentBubble=null;currentMessageId=null}
      addErrorCard(msg);addTlEntry('error','Error',esc(msg),ev.timestamp);
      break;
    }
  }
}

async function loadImageState(){

  try{
    const data=await api('GET','/api/agent/sessions/'+sessionId+'/image-state?limit=100');
    (data.tasks||[]).forEach(item=>{
      const jobId=String(item.job_id||'');if(!jobId)return;

      if(item.image_url)images[jobId]={url:item.image_url,sourceText:item.source_text||''};

    el.innerHTML=`<div class="task-top"><span class="task-mode">${esc(modeName)}</span><span class="status-badge ${status}">${statusLabel(status)}</span></div>`+
      `${sourceText?`<div class="task-source">${esc(sourceText)}</div>`:''}`+
      `<details class="task-details"><summary>任务详情</summary><div class="task-detail-row">任务 ID：${esc(jobId)}</div>${planId?`<div class="task-detail-row">生成计划 ID：${esc(planId)}</div>`:''}</details>`;
    $l.appendChild(el);
  });
}

// Gallery
function renderGallery(){
  const $g=document.getElementById('gallery-grid');$g.innerHTML='';
  const entries=Object.entries(images).reverse();
  if(!entries.length){$g.innerHTML=`<div class="empty-state"><div class="empty-icon">🖼️</div><p>${imageStateLoading?'正在加载图库…':imageStateError?'图库加载失败':'暂无图片'}</p></div>`;return}
  entries.forEach(([jobId,img])=>{
    const el=document.createElement('div');el.className='gallery-img-wrap';
    const href=safeHref(img.url);if(!href)return;
    const image=document.createElement('img');image.src=href;image.alt=img.sourceText||'image';image.loading='lazy';
    image.addEventListener('click',()=>openImageViewer(href,image.alt,image));
    const meta=document.createElement('div');meta.className='gallery-meta';meta.textContent=jobId.slice(0,12)+'…';
    el.append(image,meta);
    $g.appendChild(el);
  });
}

// Debug


// Send
const $input=document.getElementById('chat-input'),$sendBtn=document.getElementById('send-btn');
const $modeSuggestions=document.getElementById('mode-suggestions');
let imageModeCatalog=null,modeSuggestionButtons=[],modeSuggestionIndex=0;
function normalizeModeQuery(value){return String(value||'').toLowerCase().replace(/[\s_.\-·]+/g,'')}
function modeCompletionContext(value){
  if(!/^\/nsfw\b/i.test(value))return null;
  const match=value.match(/^(.*(?:--model|-m))(?:=|\s+)?([^\s]*)$/i);
  return match?{prefix:match[1],partial:match[2]||''}:null;
}
async function ensureImageModeCatalog(){
  if(imageModeCatalog)return imageModeCatalog;
  const data=await api('GET','/api/image-modes');imageModeCatalog=data.modes||[];return imageModeCatalog;
}
function hideModeSuggestions(){$modeSuggestions.hidden=true;$modeSuggestions.replaceChildren();modeSuggestionButtons=[];modeSuggestionIndex=0}
function activateModeSuggestion(index){
  if(!modeSuggestionButtons.length)return;
  modeSuggestionIndex=(index+modeSuggestionButtons.length)%modeSuggestionButtons.length;
  modeSuggestionButtons.forEach((button,i)=>button.classList.toggle('active',i===modeSuggestionIndex));
  modeSuggestionButtons[modeSuggestionIndex].scrollIntoView({block:'nearest'});
}
function selectModeSuggestion(item){
  const context=modeCompletionContext($input.value);if(!context)return;
  $input.value=context.prefix+' '+item.name+' ';
  $input.style.height='auto';$input.style.height=Math.min($input.scrollHeight,120)+'px';
  hideModeSuggestions();updateComposerState();$input.focus();
}
async function updateModeSuggestions(){
  const requestedValue=$input.value;const context=modeCompletionContext(requestedValue);
  if(!context){hideModeSuggestions();return}
  try{
    const modes=await ensureImageModeCatalog();if($input.value!==requestedValue)return;
    const query=normalizeModeQuery(context.partial);
    const matches=modes.filter(item=>{
      const values=[item.name,item.id,...(item.aliases||[])];
      return !query||values.some(value=>normalizeModeQuery(value).includes(query));
    });
    $modeSuggestions.replaceChildren();modeSuggestionButtons=[];
    matches.forEach(item=>{
      const button=document.createElement('button');button.type='button';button.className='mode-suggestion';button.setAttribute('role','option');
      button.innerHTML=`<span class="mode-suggestion-name">${esc(item.name)}</span><span class="mode-suggestion-id">${esc(item.id)}</span>`;
      button.addEventListener('pointerdown',e=>e.preventDefault());
      button.addEventListener('click',()=>selectModeSuggestion(item));
      $modeSuggestions.appendChild(button);modeSuggestionButtons.push(button);
    });
    $modeSuggestions.hidden=!modeSuggestionButtons.length;if(modeSuggestionButtons.length)activateModeSuggestion(0);
  }catch{hideModeSuggestions()}
}
function updateComposerState(){
  const ready=!sending&&!!sessionId&&!!$input.value.trim();
  $sendBtn.disabled=!ready;$sendBtn.classList.toggle('ready',ready);
}
async function sendMessage(){
  const text=$input.value.trim();if(!text||sending||!sessionId)return;
  lastUserText=text;autoFollowMessages=true;
  sending=true;updateComposerState();
  hideModeSuggestions();$input.value='';$input.style.height='';
  addBubble('user',text,false);
  try{await api('POST','/api/agent/sessions/'+sessionId+'/messages',{content:text})}
  catch(err){
    if(!err.message.startsWith('401')&&!err.message.startsWith('500 ')&&Date.now()-lastAgentErrorAt>1000)addErrorCard(err.message);
  }
  finally{sending=false;updateComposerState();$input.focus()}
}
$sendBtn.addEventListener('click',sendMessage);
$input.addEventListener('keydown',e=>{
  if(!$modeSuggestions.hidden&&modeSuggestionButtons.length){
    if(e.key==='ArrowDown'){e.preventDefault();activateModeSuggestion(modeSuggestionIndex+1);return}
    if(e.key==='ArrowUp'){e.preventDefault();activateModeSuggestion(modeSuggestionIndex-1);return}
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();modeSuggestionButtons[modeSuggestionIndex].click();return}
    if(e.key==='Escape'){e.preventDefault();hideModeSuggestions();return}
  }
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}
})
$input.addEventListener('input',()=>{
  $input.style.height='auto';$input.style.height=Math.min($input.scrollHeight,120)+'px';updateComposerState();updateModeSuggestions();
})
$input.addEventListener('blur',()=>setTimeout(hideModeSuggestions,120))

// Init
async function ensureSession(){
  if(sessionId){try{return await api('GET','/api/agent/sessions/'+sessionId)}catch{}}
  const d=await api('POST','/api/agent/sessions');
  sessionId=d.session_id;localStorage.setItem(SESSION_KEY,sessionId);
  return {session_id:sessionId,messages:[]};
}
function renderHistory(messages){
  if(messages.length)return;
  (messages||[]).forEach(message=>{
    if(message.role==='user'||message.role==='assistant')addBubble(message.role==='assistant'?'agent':'user',message.content||'',false);
  });
  autoFollowMessages=true;scrollBottom(true);
}
async function init(){
  setStatus('connecting','Initializing...');
  try{
    const session=await ensureSession();renderHistory(session.messages);
    connectSSE();updateComposerState();loadImageState();
  }
  catch(err){if(!err.message.startsWith('401'))setStatus('error','Connection failed')}
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js?v=16',{scope:'/',updateViaCache:'none'})
    .then(registration=>registration.update()).catch(()=>{});
}
if(token){hideLogin();init()}
</script>
