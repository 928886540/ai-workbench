<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Leon Agent">
<meta name="theme-color" content="#2783DE">
<link rel="manifest" href="manifest.json">
<title>Leon Agent</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif;font-size:16px;line-height:1.5;background:#fff;color:#2C2C2B;-webkit-font-smoothing:antialiased}
:root{
  --blue:#2783DE;--blue-soft:#E5F2FC;
  --green:#46A171;--green-soft:#E8F1EC;
  --orange:#D5803B;--orange-soft:#FBEBDE;
  --red:#E56458;--red-soft:#FCE9E7;
  --surface:#F9F8F7;--surface2:#F0EFED;
  --border:#E6E5E3;--text:#2C2C2B;--text2:#7D7A75;
  --nav-h:56px;--header-h:52px;
}
#app{display:flex;flex-direction:column;height:100%;height:100dvh;transition:opacity .2s}

/* ── Login screen ─────────────────────────────────────── */
#login-screen{
  position:fixed;inset:0;background:#fff;z-index:200;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 24px calc(32px + env(safe-area-inset-bottom));
  gap:0;
}
#login-screen.hidden{display:none}
.login-logo{font-size:56px;margin-bottom:8px;line-height:1}
.login-title{font-size:26px;font-weight:700;letter-spacing:-.5px;margin-bottom:6px}
.login-sub{font-size:14px;color:var(--text2);margin-bottom:40px;text-align:center}
.login-field{width:100%;max-width:320px;margin-bottom:12px}
.login-field label{display:block;font-size:13px;font-weight:500;color:var(--text2);margin-bottom:6px}
.login-field input{
  width:100%;border:1.5px solid var(--border);border-radius:12px;
  padding:13px 16px;font-size:16px;outline:none;font-family:inherit;
  letter-spacing:.05em;transition:border-color .15s;
}
.login-field input:focus{border-color:var(--blue)}
#login-error{color:var(--red);font-size:13px;min-height:18px;margin-bottom:4px;text-align:center;max-width:320px}
#login-btn{
  width:100%;max-width:320px;padding:15px;background:var(--blue);color:#fff;
  border:none;border-radius:14px;font-size:16px;font-weight:600;
  cursor:pointer;letter-spacing:.01em;transition:opacity .15s;
  margin-top:4px;
}
#login-btn:disabled{opacity:.5;cursor:default}
.login-hint{margin-top:20px;font-size:12px;color:var(--text2);text-align:center;max-width:300px}

/* ── Header ───────────────────────────────────────────── */
#header{
  height:var(--header-h);display:flex;align-items:center;
  justify-content:space-between;padding:0 16px;
  border-bottom:1px solid var(--border);background:#fff;
  position:sticky;top:0;z-index:20;
}
#header h1{font-size:17px;font-weight:600;letter-spacing:-.3px}
#status-wrap{display:flex;align-items:center;gap:6px;cursor:pointer}
#status-dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:background .3s}
#status-dot.online{background:var(--green)}
#status-dot.error{background:var(--red)}
#status-dot.connecting{background:var(--orange)}
#status-label{font-size:12px;color:var(--text2)}

/* ── Pages ────────────────────────────────────────────── */
#pages{flex:1;overflow:hidden;position:relative}
.page{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;flex-direction:column}
.page.active{display:flex}

/* ── Chat ─────────────────────────────────────────────── */
#chat-messages{flex:1;padding:12px 12px 8px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;-webkit-overflow-scrolling:touch}
#chat-input-wrap{
  padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  border-top:1px solid var(--border);background:#fff;
  display:flex;align-items:flex-end;gap:8px;
}
#chat-input{
  flex:1;border:1.5px solid var(--border);border-radius:20px;
  padding:9px 14px;font-size:15px;outline:none;resize:none;
  max-height:120px;line-height:1.4;font-family:inherit;
  transition:border-color .15s;
}
#chat-input:focus{border-color:var(--blue)}
#send-btn{
  width:40px;height:40px;border-radius:50%;background:var(--blue);
  color:#fff;border:none;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:opacity .15s;
}
#send-btn:disabled{opacity:.4;cursor:default}

/* ── Bubbles ──────────────────────────────────────────── */
.bubble-wrap{display:flex;flex-direction:column;max-width:85%;gap:2px}
.bubble-wrap.user{align-self:flex-end;align-items:flex-end}
.bubble-wrap.agent{align-self:flex-start;align-items:flex-start}
.bubble{padding:9px 13px;border-radius:18px;font-size:15px;line-height:1.45;word-break:break-word;white-space:pre-wrap}
.bubble.user{background:var(--blue);color:#fff;border-bottom-right-radius:5px}
.bubble.agent{background:var(--surface);color:var(--text);border-bottom-left-radius:5px}
.bubble.agent.streaming::after{content:'▋';animation:blink .7s step-start infinite}
@keyframes blink{50%{opacity:0}}

/* ── Tool cards ───────────────────────────────────────── */
.tool-card{
  align-self:flex-start;background:#fff;border:1.5px solid var(--border);
  border-radius:12px;padding:10px 13px;font-size:13px;max-width:92%;
}
.tool-header{display:flex;align-items:center;gap:7px;font-weight:600;font-size:14px}
.tool-icon{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.tool-icon.running{background:var(--blue-soft);color:var(--blue)}
.tool-icon.done{background:var(--green-soft);color:var(--green)}
.tool-icon.failed{background:var(--red-soft);color:var(--red)}
.tool-meta{margin-top:6px;color:var(--text2);font-size:12px;display:flex;flex-direction:column;gap:3px}

/* ── Status badges ────────────────────────────────────── */
.status-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.status-badge.queued{background:var(--surface2);color:var(--text2)}
.status-badge.running{background:var(--blue-soft);color:var(--blue)}
.status-badge.completed{background:var(--green-soft);color:var(--green)}
.status-badge.failed{background:var(--red-soft);color:var(--red)}

/* ── Image card ───────────────────────────────────────── */
.image-card{align-self:flex-start;border-radius:14px;overflow:hidden;border:1px solid var(--border);max-width:min(280px,85%)}
.image-card img{width:100%;display:block;object-fit:cover}
.image-card .image-meta{padding:8px 10px;font-size:11px;color:var(--text2);background:#fff}
.image-card .image-meta a{color:var(--blue);text-decoration:none}

/* ── Tasks page ───────────────────────────────────────── */
#page-tasks{padding:12px;gap:8px}
.task-item{background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:5px}
.task-top{display:flex;align-items:center;justify-content:space-between}
.task-id{font-size:12px;color:var(--text2);font-family:Menlo,monospace;word-break:break-all}
.task-plan{font-size:11px;color:var(--text2)}

/* ── Gallery page ─────────────────────────────────────── */
#page-gallery{padding:12px;display:flex;flex-direction:column;gap:8px}
#gallery-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.gallery-img-wrap{border-radius:12px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.gallery-img-wrap img{width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:pointer}
.gallery-meta{padding:6px 8px;font-size:11px;color:var(--text2)}

/* ── Debug page ───────────────────────────────────────── */
#page-debug{padding:12px;gap:8px}
.debug-section{background:var(--surface);border-radius:10px;padding:12px}
.debug-section h3{font-size:13px;font-weight:600;margin-bottom:8px}
.debug-section pre{font-family:Menlo,Consolas,monospace;font-size:11px;overflow-x:auto;color:var(--text2);white-space:pre-wrap;word-break:break-all}
#debug-events{max-height:260px;overflow-y:auto}
.debug-event{padding:4px 0;border-bottom:1px solid var(--border);font-size:11px;font-family:Menlo,monospace;color:var(--text2)}
.debug-event:last-child{border-bottom:none}
.ev-type{color:var(--blue);font-weight:600}
.debug-btn{margin-top:8px;padding:8px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;font-size:13px;cursor:pointer;width:100%}

/* ── Bottom nav ───────────────────────────────────────── */
#nav{height:var(--nav-h);display:flex;border-top:1px solid var(--border);background:#fff;padding-bottom:env(safe-area-inset-bottom)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:none;cursor:pointer;color:var(--text2);font-size:10px;font-weight:500;padding:6px 0;transition:color .15s}
.nav-icon{font-size:22px;line-height:1}
.nav-item.active{color:var(--blue)}

/* ── Empty state ──────────────────────────────────────── */
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text2);padding:32px}
.empty-icon{font-size:40px}
.empty-state p{font-size:14px;text-align:center}

/* ── Spinner ──────────────────────────────────────────── */
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
</style>
</head>
<body>

<!-- ── Login screen ───────────────────────────────────── -->
<div id="login-screen">
  <div class="login-logo">⚡</div>
  <div class="login-title">Leon Agent</div>
  <div class="login-sub">AI 生图个人助手</div>
  <div class="login-field">
    <label>Token</label>
    <input id="login-token" type="password" placeholder="输入访问密钥…" autocomplete="current-password">
  </div>
  <div id="login-error"></div>
  <button id="login-btn">连接</button>
  <p class="login-hint">首次使用请输入服务端配置的 LEON_API_TOKEN。<br>未设置 Token 时直接点击连接即可。</p>
</div>

<!-- ── Main app ────────────────────────────────────────── -->
<div id="app">
  <div id="header">
    <h1>⚡ Leon Agent</h1>
    <div id="status-wrap">
      <div id="status-dot"></div>
      <span id="status-label">未连接</span>
    </div>
  </div>

  <div id="pages">
    <div class="page active" id="page-chat">
      <div id="chat-messages"></div>
      <div id="chat-input-wrap">
        <textarea id="chat-input" placeholder="输入消息…" rows="1"></textarea>
        <button id="send-btn" aria-label="发送">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="page" id="page-tasks">
      <div id="tasks-list"></div>
    </div>

    <div class="page" id="page-gallery">
      <div id="gallery-grid"></div>
    </div>

    <div class="page" id="page-debug">
      <div class="debug-section">
        <h3>连接信息</h3>
        <pre id="debug-info">加载中…</pre>
        <button class="debug-btn" id="logout-btn">🔒 退出登录（清除 Token）</button>
      </div>
      <div class="debug-section">
        <h3>SSE 事件流</h3>
        <div id="debug-events"></div>
      </div>
    </div>
  </div>

  <nav id="nav">
    <button class="nav-item active" data-page="chat">
      <span class="nav-icon">💬</span>聊天
    </button>
    <button class="nav-item" data-page="tasks">
      <span class="nav-icon">📋</span>任务
    </button>
    <button class="nav-item" data-page="gallery">
      <span class="nav-icon">🖼️</span>图库
    </button>
    <button class="nav-item" data-page="debug">
      <span class="nav-icon">🔧</span>调试
    </button>
  </nav>
</div>

<script>
'use strict';

// ── Helpers ────────────────────────────────────────────────────────────────
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// ── Config / token storage ─────────────────────────────────────────────────
// Gateway URL is always same-origin (the server serves this page).
const BASE_URL = location.origin;
const TOKEN_KEY = 'leon_token';
const SESSION_KEY = 'leon_session';

let token = localStorage.getItem(TOKEN_KEY) || '';
let sessionId = localStorage.getItem(SESSION_KEY) || '';

// ── Login screen ───────────────────────────────────────────────────────────
const $loginScreen = document.getElementById('login-screen');
const $loginToken  = document.getElementById('login-token');
const $loginBtn    = document.getElementById('login-btn');
const $loginError  = document.getElementById('login-error');

function showLogin(err) {
  $loginError.textContent = err || '';
  $loginScreen.classList.remove('hidden');
  $loginToken.value = '';
  setTimeout(() => $loginToken.focus(), 100);
}

function hideLogin() {
  $loginScreen.classList.add('hidden');
}

$loginToken.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); doLogin(); }
});

$loginBtn.addEventListener('click', doLogin);

async function doLogin() {
  const t = $loginToken.value.trim();
  $loginBtn.disabled = true;
  $loginError.textContent = '';
  try {
    // Verify token by hitting health endpoint
    const r = await fetch(BASE_URL + '/api/health', {
      headers: t ? { Authorization: 'Bearer ' + t } : {}
    });
    if (!r.ok) throw new Error('验证失败 (' + r.status + ')');
    token = t;
    localStorage.setItem(TOKEN_KEY, token);
    hideLogin();
    await init();
  } catch (err) {
    $loginError.textContent = '❌ ' + err.message;
  } finally {
    $loginBtn.disabled = false;
  }
}

document.getElementById('logout-btn').addEventListener('click', () => {
  localStorage.removeItem(TOKEN_KEY);
  localStorage.removeItem(SESSION_KEY);
  location.reload();
});

// ── Navigation ─────────────────────────────────────────────────────────────
document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    const t = btn.dataset.page;
    document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.page === t));
    document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + t));
    if (t === 'tasks') renderTasks();
    if (t === 'gallery') renderGallery();
    if (t === 'debug') updateDebugInfo();
  });
});

// ── Status indicator ────────────────────────────────────────────────────────
const $dot = document.getElementById('status-dot');
const $lbl = document.getElementById('status-label');
function setStatus(cls, label) {
  $dot.className = cls;
  $lbl.textContent = label;
}

// ── API ─────────────────────────────────────────────────────────────────────
async function api(method, path, body) {
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const r = await fetch(BASE_URL + path, {
    method, headers,
    body: body ? JSON.stringify(body) : undefined,
  });
  if (r.status === 401) { showLogin('认证失效，请重新输入 Token'); throw new Error('401'); }
  if (!r.ok) throw new Error(r.status + ' ' + await r.text());
  return r.json();
}

// ── SSE ─────────────────────────────────────────────────────────────────────
let sse = null, sseTimer = null;

function connectSSE() {
  if (!sessionId) return;
  if (sse) { sse.close(); sse = null; }
  clearTimeout(sseTimer);
  setStatus('connecting', '连接中…');
  const url = BASE_URL + '/api/agent/sessions/' + sessionId + '/events'
    + (token ? '?token=' + encodeURIComponent(token) : '');
  sse = new EventSource(url);
  sse.onopen  = () => setStatus('online', '已连接');
  sse.onerror = () => { sse.close(); sse = null; setStatus('error', '断线'); sseTimer = setTimeout(connectSSE, 3000); };
  sse.onmessage = e => { try { handleEvent(JSON.parse(e.data)); } catch {} };
}

window.addEventListener('online', () => { clearTimeout(sseTimer); sseTimer = setTimeout(connectSSE, 500); });

// ── State ────────────────────────────────────────────────────────────────────
const tasks  = {};
const images = {};
let currentToolCard = null;
let currentBubble   = null;
let sending         = false;

// ── Event handler ─────────────────────────────────────────────────────────
function handleEvent(ev) {
  logDebug(ev);
  switch (ev.event) {
    case 'session.connected': setStatus('online', '已连接'); break;
    case 'assistant.started':
      currentBubble = addBubble('agent', '', true);
      currentToolCard = null;
      break;
    case 'assistant.delta':
      if (currentBubble) { currentBubble.querySelector('.bubble').textContent += ev.data.delta || ''; scrollBottom(); }
      break;
    case 'assistant.completed':
      if (currentBubble) {
        currentBubble.querySelector('.bubble').textContent = ev.data.content || currentBubble.querySelector('.bubble').textContent;
        currentBubble.querySelector('.bubble').classList.remove('streaming');
        scrollBottom();
      }
      currentBubble = null;
      break;
    case 'tool.started':
      currentToolCard = addToolCard(ev.data.tool_name, 'running');
      scrollBottom();
      break;
    case 'tool.finished':
      if (currentToolCard) updateToolCard(currentToolCard, ev.data.ok !== false ? 'done' : 'failed');
      break;
    case 'image.task.created':
      tasks[ev.data.job_id] = { status: ev.data.status || 'queued', planId: ev.data.generation_plan_id };
      if (currentToolCard) addTaskMeta(currentToolCard, ev.data);
      break;
    case 'image.task.updated':
      if (tasks[ev.data.job_id]) tasks[ev.data.job_id].status = ev.data.status;
      if (currentToolCard) updateBadge(currentToolCard, ev.data.job_id, ev.data.status);
      break;
    case 'image.completed':
      tasks[ev.data.job_id] = { ...(tasks[ev.data.job_id] || {}), status: 'completed' };
      images[ev.data.job_id] = { url: ev.data.image_url, planId: ev.data.generation_plan_id };
      addImageCard(ev.data.image_url, ev.data.job_id);
      break;
    case 'agent.error': {
      const msg = '❌ ' + ev.data.error;
      if (currentBubble) { const b = currentBubble.querySelector('.bubble'); b.textContent = msg; b.classList.remove('streaming'); currentBubble = null; }
      else addBubble('agent', msg, false);
      break;
    }
  }
}

// ── Chat DOM ───────────────────────────────────────────────────────────────
const $msgs = document.getElementById('chat-messages');
function addBubble(role, text, streaming) {
  const w = document.createElement('div'); w.className = 'bubble-wrap ' + role;
  const b = document.createElement('div'); b.className = 'bubble ' + role + (streaming ? ' streaming' : '');
  b.textContent = text; w.appendChild(b); $msgs.appendChild(w); scrollBottom(); return w;
}
function addToolCard(name, state) {
  const c = document.createElement('div'); c.className = 'tool-card';
  c.innerHTML = `<div class="tool-header"><div class="tool-icon ${state}">${iconFor(state)}</div><span>${esc(name)}</span></div><div class="tool-meta"></div>`;
  $msgs.appendChild(c); return c;
}
function updateToolCard(c, state) {
  const i = c.querySelector('.tool-icon'); i.className = 'tool-icon ' + state; i.innerHTML = iconFor(state);
}
function iconFor(s) {
  return s === 'running' ? '<div class="spinner"></div>' : s === 'done' ? '✓' : '✗';
}
function addTaskMeta(card, data) {
  const m = card.querySelector('.tool-meta');
  const r = document.createElement('span');
  r.innerHTML = `job: <code>${esc(String(data.job_id || ''))}</code> &nbsp;<span class="status-badge ${data.status || 'queued'}" id="badge-${esc(data.job_id)}">${data.status || 'queued'}</span>`;
  m.appendChild(r);
}
function updateBadge(card, jobId, status) {
  const b = card.querySelector('#badge-' + jobId);
  if (b) { b.className = 'status-badge ' + status; b.textContent = status; }
}
function addImageCard(url, jobId) {
  const c = document.createElement('div'); c.className = 'image-card';
  c.innerHTML = `<img src="${esc(url)}" alt="生成图片" loading="lazy" onclick="window.open('${esc(url)}','_blank')"><div class="image-meta"><a href="${esc(url)}" target="_blank">查看原图 →</a></div>`;
  $msgs.appendChild(c); scrollBottom();
}
function scrollBottom() { requestAnimationFrame(() => { $msgs.scrollTop = $msgs.scrollHeight; }); }

// ── Tasks ──────────────────────────────────────────────────────────────────
function renderTasks() {
  const $l = document.getElementById('tasks-list'); $l.innerHTML = '';
  const entries = Object.entries(tasks).reverse();
  if (!entries.length) { $l.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><p>暂无生图任务</p></div>'; return; }
  entries.forEach(([jobId, t]) => {
    const el = document.createElement('div'); el.className = 'task-item';
    el.innerHTML = `<div class="task-top"><span class="task-id">${esc(jobId)}</span><span class="status-badge ${t.status}">${t.status}</span></div>${t.planId ? `<div class="task-plan">plan: ${esc(t.planId)}</div>` : ''}`;
    $l.appendChild(el);
  });
}

// ── Gallery ────────────────────────────────────────────────────────────────
function renderGallery() {
  const $g = document.getElementById('gallery-grid'); $g.innerHTML = '';
  const entries = Object.entries(images).reverse();
  if (!entries.length) { $g.innerHTML = '<div class="empty-state"><div class="empty-icon">🖼️</div><p>暂无已完成图片</p></div>'; return; }
  entries.forEach(([jobId, img]) => {
    const el = document.createElement('div'); el.className = 'gallery-img-wrap';
    el.innerHTML = `<img src="${esc(img.url)}" alt="图片" loading="lazy" onclick="window.open('${esc(img.url)}','_blank')"><div class="gallery-meta">${esc(jobId.slice(0,12))}…</div>`;
    $g.appendChild(el);
  });
}

// ── Debug ──────────────────────────────────────────────────────────────────
function updateDebugInfo() {
  document.getElementById('debug-info').textContent = JSON.stringify({
    session_id: sessionId,
    gateway: BASE_URL,
    sse: sse ? ['CONNECTING','OPEN','CLOSED'][sse.readyState] : 'none',
    tasks: Object.keys(tasks).length,
    images: Object.keys(images).length,
  }, null, 2);
}
function logDebug(ev) {
  const $de = document.getElementById('debug-events');
  const el = document.createElement('div'); el.className = 'debug-event';
  el.innerHTML = `<span class="ev-type">${esc(ev.event)}</span> ${esc(JSON.stringify(ev.data||{}))}`.slice(0,240);
  $de.prepend(el);
  if ($de.children.length > 100) $de.lastChild.remove();
}

// ── Send ───────────────────────────────────────────────────────────────────
const $input   = document.getElementById('chat-input');
const $sendBtn = document.getElementById('send-btn');
async function sendMessage() {
  const text = $input.value.trim();
  if (!text || sending) return;
  sending = true; $sendBtn.disabled = true;
  $input.value = ''; $input.style.height = '';
  addBubble('user', text, false);
  try {
    await api('POST', '/api/agent/sessions/' + sessionId + '/messages', { content: text });
  } catch (err) {
    if (!err.message.startsWith('401'))
      addBubble('agent', '❌ ' + err.message, false);
  } finally {
    sending = false; $sendBtn.disabled = false; $input.focus();
  }
}
$sendBtn.addEventListener('click', sendMessage);
$input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
$input.addEventListener('input', () => { $input.style.height = 'auto'; $input.style.height = Math.min($input.scrollHeight, 120) + 'px'; });

// ── Init ───────────────────────────────────────────────────────────────────
async function ensureSession() {
  if (sessionId) {
    try { await api('GET', '/api/agent/sessions/' + sessionId); return; } catch {}
  }
  const d = await api('POST', '/api/agent/sessions');
  sessionId = d.session_id;
  localStorage.setItem(SESSION_KEY, sessionId);
}

async function init() {
  setStatus('connecting', '初始化…');
  try {
    await ensureSession();
    connectSSE();
    updateDebugInfo();
  } catch (err) {
    if (!err.message.startsWith('401')) setStatus('error', '连接失败');
  }
}

// ── PWA ────────────────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

// ── Bootstrap ──────────────────────────────────────────────────────────────
// If token already saved, skip login screen directly
if (token) { hideLogin(); init(); }
// else login screen is already visible
</script>
</body>
</html>
