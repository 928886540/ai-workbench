<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Leon Agent">
<meta name="theme-color" content="#2783DE">
<link rel="manifest" href="manifest.json">
<title>Leon Agent</title>
<!-- marked.js for markdown rendering -->
<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif;font-size:16px;line-height:1.5;background:#fff;color:#2C2C2B;-webkit-font-smoothing:antialiased}
:root{
  --blue:#2783DE;--blue-soft:#E5F2FC;
  --green:#46A171;--green-soft:#E8F1EC;
  --orange:#D5803B;--orange-soft:#FBEBDE;
  --red:#E56458;--red-soft:#FCE9E7;
  --purple:#7B5EA7;--purple-soft:#EDE8F5;
  --surface:#F9F8F7;--surface2:#F0EFED;
  --border:#E6E5E3;--text:#2C2C2B;--text2:#7D7A75;
  --nav-h:56px;--header-h:52px;
}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}

/* Login */
#login-screen{position:fixed;inset:0;background:#fff;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px calc(32px + env(safe-area-inset-bottom))}
#login-screen.hidden{display:none}
.login-logo{font-size:56px;margin-bottom:8px;line-height:1}
.login-title{font-size:26px;font-weight:700;letter-spacing:-.5px;margin-bottom:6px}
.login-sub{font-size:14px;color:var(--text2);margin-bottom:40px;text-align:center}
.login-field{width:100%;max-width:320px;margin-bottom:12px}
.login-field label{display:block;font-size:13px;font-weight:500;color:var(--text2);margin-bottom:6px}
.login-field input{width:100%;border:1.5px solid var(--border);border-radius:12px;padding:13px 16px;font-size:16px;outline:none;font-family:inherit;transition:border-color .15s}
.login-field input:focus{border-color:var(--blue)}
#login-error{color:var(--red);font-size:13px;min-height:18px;margin-bottom:4px;text-align:center;max-width:320px}
#login-btn{width:100%;max-width:320px;padding:15px;background:var(--blue);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;margin-top:4px;transition:opacity .15s}
#login-btn:disabled{opacity:.5;cursor:default}
.login-hint{margin-top:20px;font-size:12px;color:var(--text2);text-align:center;max-width:300px}

/* Header */
#header{height:var(--header-h);display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--border);background:#fff;position:sticky;top:0;z-index:20}
#header h1{font-size:17px;font-weight:600;letter-spacing:-.3px}
#header-right{display:flex;align-items:center;gap:10px}
#status-wrap{display:flex;align-items:center;gap:6px}
#status-dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:background .3s}
#status-dot.online{background:var(--green)}
#status-dot.error{background:var(--red)}
#status-dot.connecting{background:var(--orange)}
#status-label{font-size:12px;color:var(--text2)}
#timeline-toggle{border:none;background:var(--surface2);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;color:var(--text2);transition:all .15s;white-space:nowrap}
#timeline-toggle.active{background:#1a1a2e;color:#fff}

/* Pages */
#pages{flex:1;overflow:hidden;position:relative}
.page{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;flex-direction:column}
.page.active{display:flex}

/* Chat */
#chat-messages{flex:1;padding:12px 12px 8px;display:flex;flex-direction:column;gap:6px;overflow-y:auto;-webkit-overflow-scrolling:touch}
#chat-input-wrap{padding:8px 12px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:#fff;display:flex;align-items:flex-end;gap:8px}
#chat-input{flex:1;border:1.5px solid var(--border);border-radius:20px;padding:9px 14px;font-size:15px;outline:none;resize:none;max-height:120px;line-height:1.4;font-family:inherit;transition:border-color .15s}
#chat-input:focus{border-color:var(--blue)}

/* Send button — active when input has content */
#send-btn{
  width:40px;height:40px;border-radius:50%;
  background:var(--surface2);color:var(--text2);
  border:none;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s,color .2s,transform .1s;
}
#send-btn.ready{background:var(--blue);color:#fff}
#send-btn.ready:active{transform:scale(.92)}
#send-btn:disabled{opacity:.4;cursor:default}

/* Bubble wrap */
.bubble-wrap{display:flex;flex-direction:column;max-width:85%;gap:2px}
.bubble-wrap.user{align-self:flex-end;align-items:flex-end}
.bubble-wrap.agent{align-self:flex-start;align-items:flex-start}

/* User bubble */
.bubble.user{background:var(--blue);color:#fff;border-radius:18px;border-bottom-right-radius:5px;padding:9px 13px;font-size:15px;line-height:1.5;word-break:break-word;white-space:pre-wrap}

/* Agent bubble — markdown host */
.bubble.agent{
  background:var(--surface);color:var(--text);
  border-radius:18px;border-bottom-left-radius:5px;
  padding:9px 13px;font-size:15px;line-height:1.55;
  word-break:break-word;
}
/* Markdown styles inside agent bubble */
.bubble.agent p{margin:.25em 0}
.bubble.agent p:first-child{margin-top:0}
.bubble.agent p:last-child{margin-bottom:0}
.bubble.agent h1,.bubble.agent h2,.bubble.agent h3{font-size:1em;font-weight:700;margin:.4em 0 .2em}
.bubble.agent ul,.bubble.agent ol{padding-left:1.4em;margin:.25em 0}
.bubble.agent li{margin:.1em 0}
.bubble.agent code{font-family:Menlo,monospace;font-size:13px;background:rgba(0,0,0,.06);border-radius:4px;padding:1px 5px}
.bubble.agent pre{background:rgba(0,0,0,.06);border-radius:8px;padding:10px 12px;overflow-x:auto;margin:.4em 0}
.bubble.agent pre code{background:none;padding:0;font-size:12px}
.bubble.agent blockquote{border-left:3px solid var(--border);padding-left:10px;color:var(--text2);margin:.3em 0}
.bubble.agent strong{font-weight:600}
.bubble.agent a{color:var(--blue);text-decoration:none}
.bubble.agent hr{border:none;border-top:1px solid var(--border);margin:.5em 0}
/* Streaming plain text mode (before md is applied) */
.bubble.agent.streaming{white-space:pre-wrap}

/* 6-B Thinking bubble */
.thinking-bubble{
  align-self:flex-start;
  display:flex;align-items:center;gap:8px;
  background:var(--surface);border-radius:18px;border-bottom-left-radius:5px;
  padding:9px 14px;font-size:14px;color:var(--text2);
}
.thinking-dots span{
  display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--text2);margin:0 1.5px;
  animation:tdot .9s ease-in-out infinite;
}
.thinking-dots span:nth-child(2){animation-delay:.15s}
.thinking-dots span:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-4px);opacity:1}}
.thinking-timer{font-variant-numeric:tabular-nums;font-size:12px;opacity:.7;min-width:32px}

/* Tool cards */
.tool-card{align-self:flex-start;background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:10px 13px;font-size:13px;max-width:92%;cursor:pointer;transition:border-color .15s}
.tool-card:hover{border-color:var(--blue)}
.tool-header{display:flex;align-items:center;gap:7px;font-weight:600;font-size:14px}
.tool-icon{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.tool-icon.running{background:var(--blue-soft);color:var(--blue)}
.tool-icon.done{background:var(--green-soft);color:var(--green)}
.tool-icon.failed{background:var(--red-soft);color:var(--red)}
.tool-meta{margin-top:6px;color:var(--text2);font-size:12px;display:flex;flex-direction:column;gap:3px}
.tool-detail{display:none;margin-top:8px;background:var(--surface);border-radius:8px;padding:8px 10px;font-size:12px;font-family:Menlo,monospace;color:var(--text2);white-space:pre-wrap;word-break:break-all;max-height:160px;overflow-y:auto}
.tool-card.open .tool-detail{display:block}
.tool-chevron{margin-left:auto;font-size:10px;color:var(--text2);transition:transform .2s}
.tool-card.open .tool-chevron{transform:rotate(180deg)}

/* Status badges */
.status-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.status-badge.queued{background:var(--surface2);color:var(--text2)}
.status-badge.running{background:var(--blue-soft);color:var(--blue)}
.status-badge.completed{background:var(--green-soft);color:var(--green)}
.status-badge.failed{background:var(--red-soft);color:var(--red)}

/* 6-E Error card */
.error-card{
  align-self:flex-start;max-width:90%;
  background:var(--red-soft);border:1.5px solid var(--red);
  border-radius:12px;padding:10px 13px;
  display:flex;flex-direction:column;gap:6px;
}
.error-card-header{display:flex;align-items:center;gap:7px;font-weight:600;font-size:14px;color:var(--red)}
.error-card-msg{font-size:13px;color:#7a2020;word-break:break-word}
.error-retry-btn{
  align-self:flex-start;background:var(--red);color:#fff;
  border:none;border-radius:8px;padding:5px 12px;
  font-size:12px;font-weight:600;cursor:pointer;
  transition:opacity .15s;
}
.error-retry-btn:hover{opacity:.85}

/* 6-D Image skeleton */
.image-placeholder{
  align-self:flex-start;width:min(260px,80%);
  border-radius:14px;overflow:hidden;border:1.5px solid var(--border);background:var(--surface);
}
.image-placeholder-inner{
  width:100%;aspect-ratio:1;
  background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%);
  background-size:200% 100%;animation:shimmer 1.4s infinite;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.image-placeholder-label{padding:8px 12px;font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px}
.image-placeholder-label .spinner{flex-shrink:0}

/* Image card */
.image-card{align-self:flex-start;border-radius:14px;overflow:hidden;border:1px solid var(--border);max-width:min(280px,85%);animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.image-card img{width:100%;display:block;object-fit:cover;cursor:pointer}
.image-card .image-meta{padding:8px 10px;font-size:11px;color:var(--text2);background:#fff}
.image-card .image-meta a{color:var(--blue);text-decoration:none}

/* Tasks */
#page-tasks{padding:12px;gap:8px}
.task-item{background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:5px}
.task-top{display:flex;align-items:center;justify-content:space-between}
.task-id{font-size:12px;color:var(--text2);font-family:Menlo,monospace;word-break:break-all}

/* Gallery */
#page-gallery{padding:12px;display:flex;flex-direction:column;gap:8px}
#gallery-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.gallery-img-wrap{border-radius:12px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.gallery-img-wrap img{width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:pointer}
.gallery-meta{padding:6px 8px;font-size:11px;color:var(--text2)}

/* Debug */
#page-debug{padding:12px;gap:8px}
.debug-section{background:var(--surface);border-radius:10px;padding:12px}
.debug-section h3{font-size:13px;font-weight:600;margin-bottom:8px}
.debug-section pre{font-family:Menlo,Consolas,monospace;font-size:11px;overflow-x:auto;color:var(--text2);white-space:pre-wrap;word-break:break-all}
#debug-events{max-height:260px;overflow-y:auto}
.debug-event{padding:4px 0;border-bottom:1px solid var(--border);font-size:11px;font-family:Menlo,monospace;color:var(--text2)}
.debug-event:last-child{border-bottom:none}
.ev-type{color:var(--blue);font-weight:600}
.debug-btn{margin-top:8px;padding:8px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;font-size:13px;cursor:pointer;width:100%}

/* Timeline Overlay */
#timeline-overlay{position:fixed;inset:0;z-index:100;background:#0f1117;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .25s}
#timeline-overlay.open{opacity:1;pointer-events:all}
#iv-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;padding-top:calc(16px + env(safe-area-inset-top));border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}
#iv-title{color:#fff;font-size:18px;font-weight:700;letter-spacing:-.3px}
#iv-subtitle{color:rgba(255,255,255,.45);font-size:12px;margin-top:1px}
#iv-close{border:none;background:rgba(255,255,255,.1);color:#fff;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
#iv-status-bar{display:flex;gap:8px;padding:10px 20px;border-bottom:1px solid rgba(255,255,255,.06);overflow-x:auto;flex-shrink:0}
.iv-stat{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);border-radius:8px;padding:5px 10px;white-space:nowrap}
.iv-stat-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.iv-stat-dot.green{background:#46A171}
.iv-stat-dot.blue{background:#2783DE;animation:pulse 1.5s ease-in-out infinite}
.iv-stat-dot.gray{background:#555}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.iv-stat-label{font-size:11px;color:rgba(255,255,255,.5)}
.iv-stat-value{font-size:12px;color:#fff;font-weight:600}
#iv-timeline{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 20px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.tl-entry{display:flex;gap:12px}
.tl-line-col{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:24px}
.tl-dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.tl-connector{width:2px;flex:1;min-height:12px;background:rgba(255,255,255,.08);margin:2px 0}
.tl-body{flex:1;padding-bottom:16px}
.tl-label{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.tl-content{border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.5}
.tl-content code{font-family:Menlo,monospace;font-size:12px;background:rgba(255,255,255,.08);border-radius:4px;padding:1px 4px}
.tl-time{font-size:10px;color:rgba(255,255,255,.3);margin-top:4px}
.tl-user .tl-dot{background:#2783DE}.tl-user .tl-label{color:#5E9FE8}.tl-user .tl-content{background:rgba(39,131,222,.12);color:#C8E0FF}
.tl-agent .tl-dot{background:#46A171}.tl-agent .tl-label{color:#72BC8F}.tl-agent .tl-content{background:rgba(70,161,113,.1);color:#B8DDCA;white-space:pre-wrap}
.tl-tool .tl-dot{background:#D5803B}.tl-tool .tl-label{color:#DE9255}.tl-tool .tl-content{background:rgba(213,128,59,.1);color:#F5C79A}
.tl-image .tl-dot{background:#7B5EA7}.tl-image .tl-label{color:#B09FCC}.tl-image .tl-content{background:rgba(123,94,167,.1)}
.tl-image img{width:100%;max-width:240px;border-radius:8px;display:block;margin-top:6px;cursor:pointer}
.tl-error .tl-dot{background:#E56458}.tl-error .tl-label{color:#E97366}.tl-error .tl-content{background:rgba(229,100,88,.1);color:#FFBBB6}
.tl-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:600;margin-left:6px}
.tl-badge.queued{background:rgba(255,255,255,.1);color:rgba(255,255,255,.5)}
.tl-badge.running{background:rgba(39,131,222,.25);color:#5E9FE8}
.tl-badge.completed{background:rgba(70,161,113,.25);color:#72BC8F}
.tl-badge.failed{background:rgba(229,100,88,.25);color:#E97366}

/* Nav */
#nav{height:var(--nav-h);display:flex;border-top:1px solid var(--border);background:#fff;padding-bottom:env(safe-area-inset-bottom)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:none;cursor:pointer;color:var(--text2);font-size:10px;font-weight:500;padding:6px 0;transition:color .15s}
.nav-icon{font-size:22px;line-height:1}
.nav-item.active{color:var(--blue)}

/* Misc */
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text2);padding:32px}
.empty-icon{font-size:40px}
.empty-state p{font-size:14px;text-align:center}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
</style>
</head>
<body>

<!-- Login -->
<div id="login-screen">
  <div class="login-logo">⚡</div>
  <div class="login-title">Leon Agent</div>
  <div class="login-sub">AI 生图个人助手</div>
  <div class="login-field">
    <label>Token</label>
    <input id="login-token" type="password" placeholder="输入访问密钥…" autocomplete="current-password">
  </div>
  <div id="login-error"></div>
  <button id="login-btn">连接</button>
  <p class="login-hint">未设置 Token 时直接点击连接即可。</p>
</div>

<!-- App -->
<div id="app">
  <div id="header">
    <h1>⚡ Leon Agent</h1>
    <div id="header-right">
      <button id="timeline-toggle">Timeline</button>
      <div id="status-wrap">
        <div id="status-dot"></div>
        <span id="status-label">未连接</span>
      </div>
    </div>
  </div>

  <div id="pages">
    <div class="page active" id="page-chat">
      <div id="chat-messages"></div>
      <div id="chat-input-wrap">
        <textarea id="chat-input" placeholder="输入消息…" rows="1"></textarea>
        <button id="send-btn" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="page" id="page-tasks"><div id="tasks-list"></div></div>
    <div class="page" id="page-gallery"><div id="gallery-grid"></div></div>
    <div class="page" id="page-debug">
      <div class="debug-section"><h3>Runtime Info</h3><pre id="debug-info">加载中…</pre><button class="debug-btn" id="logout-btn">🔒 退出登录</button></div>
      <div class="debug-section"><h3>SSE Event Stream</h3><div id="debug-events"></div></div>
    </div>
  </div>

  <nav id="nav">
    <button class="nav-item active" data-page="chat"><span class="nav-icon">💬</span>聊天</button>
    <button class="nav-item" data-page="tasks"><span class="nav-icon">📋</span>任务</button>
    <button class="nav-item" data-page="gallery"><span class="nav-icon">🖼️</span>图库</button>
    <button class="nav-item" data-page="debug"><span class="nav-icon">🔧</span>调试</button>
  </nav>
</div>

<!-- Timeline Overlay -->
<div id="timeline-overlay">
  <div id="iv-header">
    <div><div id="iv-title">⚡ Leon Agent &mdash; Agent Timeline</div><div id="iv-subtitle">Real-time decision trace</div></div>
    <button id="iv-close">Close</button>
  </div>
  <div id="iv-status-bar">
    <div class="iv-stat"><div class="iv-stat-dot gray" id="iv-dot-sse"></div><span class="iv-stat-label">SSE</span><span class="iv-stat-value" id="iv-val-sse">--</span></div>
    <div class="iv-stat"><div class="iv-stat-dot gray" id="iv-dot-session"></div><span class="iv-stat-label">Session</span><span class="iv-stat-value" id="iv-val-session">—</span></div>
    <div class="iv-stat"><div class="iv-stat-dot gray" id="iv-dot-turns"></div><span class="iv-stat-label">Turns</span><span class="iv-stat-value" id="iv-val-turns">0</span></div>
    <div class="iv-stat"><div class="iv-stat-dot gray" id="iv-dot-tools"></div><span class="iv-stat-label">Tool Calls</span><span class="iv-stat-value" id="iv-val-tools">0</span></div>
    <div class="iv-stat"><div class="iv-stat-dot gray" id="iv-dot-images"></div><span class="iv-stat-label">Images</span><span class="iv-stat-value" id="iv-val-images">0</span></div>
  </div>
  <div id="iv-timeline"></div>
</div>

<script>
'use strict';

// Configure marked: safe, no mangle
if(typeof marked !== 'undefined'){
  marked.setOptions({breaks:true,gfm:true});
}
function renderMd(text){
  if(typeof marked==='undefined') return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // sanitize: strip <script> etc
  return marked.parse(text);
}

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function fmtTime(iso){try{return new Date(iso).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}catch{return iso}}

const BASE_URL=location.origin;
const TOKEN_KEY='leon_token',SESSION_KEY='leon_session';
let token=localStorage.getItem(TOKEN_KEY)||'';
let sessionId=localStorage.getItem(SESSION_KEY)||'';

// Login
const $loginScreen=document.getElementById('login-screen');
const $loginToken=document.getElementById('login-token');
const $loginBtn=document.getElementById('login-btn');
const $loginError=document.getElementById('login-error');
function showLogin(err){$loginError.textContent=err||'';$loginScreen.classList.remove('hidden');setTimeout(()=>$loginToken.focus(),100)}
function hideLogin(){$loginScreen.classList.add('hidden')}
$loginToken.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doLogin()}})
$loginBtn.addEventListener('click',doLogin);
async function doLogin(){
  const t=$loginToken.value.trim();
  $loginBtn.disabled=true;$loginError.textContent='';
  try{
    const r=await fetch(BASE_URL+'/api/health',{headers:t?{Authorization:'Bearer '+t}:{}});
    if(!r.ok)throw new Error('Auth failed ('+r.status+')');
    token=t;localStorage.setItem(TOKEN_KEY,token);hideLogin();await init();
  }catch(err){$loginError.textContent='❌ '+err.message}
  finally{$loginBtn.disabled=false}
}
document.getElementById('logout-btn').addEventListener('click',()=>{localStorage.removeItem(TOKEN_KEY);localStorage.removeItem(SESSION_KEY);location.reload()});

// Nav
document.querySelectorAll('.nav-item').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const t=btn.dataset.page;
    document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.page===t));
    document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id==='page-'+t));
    if(t==='tasks')renderTasks();
    if(t==='gallery')renderGallery();
    if(t==='debug')updateDebugInfo();
  });
});

// Status
const $dot=document.getElementById('status-dot'),$lbl=document.getElementById('status-label');
function setStatus(cls,label){$dot.className=cls;$lbl.textContent=label}

// API
async function api(method,path,body){
  const headers={'Content-Type':'application/json'};
  if(token)headers['Authorization']='Bearer '+token;
  const r=await fetch(BASE_URL+path,{method,headers,body:body?JSON.stringify(body):undefined});
  if(r.status===401){showLogin('Token expired');throw new Error('401')}
  if(!r.ok)throw new Error(r.status+' '+await r.text());
  return r.json();
}

// SSE
let sse=null,sseTimer=null;
function connectSSE(){
  if(!sessionId)return;
  if(sse){sse.close();sse=null}
  clearTimeout(sseTimer);setStatus('connecting','Connecting...');
  const url=BASE_URL+'/api/agent/sessions/'+sessionId+'/events'+(token?'?token='+encodeURIComponent(token):'');
  sse=new EventSource(url);
  sse.onopen=()=>setStatus('online','Connected');
  sse.onerror=()=>{sse.close();sse=null;setStatus('error','Disconnected');sseTimer=setTimeout(connectSSE,3000)}
  sse.onmessage=e=>{try{handleEvent(JSON.parse(e.data))}catch{}}
}
window.addEventListener('online',()=>{clearTimeout(sseTimer);sseTimer=setTimeout(connectSSE,500)})

// State
const tasks={},images={};
let currentToolCard=null,currentBubble=null,sending=false;
let ivTurns=0,ivTools=0;
const imagePlaceholders={};
// Buffer raw text during streaming (for MD render on complete)
let streamBuffer='';

// ══ 6-A Typewriter ══
let twQueue=[],twBubble=null,twRunning=false;
function twEnqueue(text,bubbleEl){
  twBubble=bubbleEl;
  for(const ch of text) twQueue.push(ch);
  if(!twRunning)twTick();
}
function twTick(){
  if(!twQueue.length){twRunning=false;return}
  twRunning=true;
  if(twBubble) twBubble.textContent+=twQueue.shift();
  scrollBottom();
  setTimeout(twTick,14);
}
function twFlush(finalText,bubbleEl){
  twQueue=[];twRunning=false;
  // Switch from plain-text streaming to rendered markdown
  if(bubbleEl){
    bubbleEl.classList.remove('streaming');
    bubbleEl.innerHTML=renderMd(finalText);
  }
}

// ══ 6-B Thinking ══
let thinkingEl=null,thinkingStart=0,thinkingTimer=null;
function showThinking(){
  const el=document.createElement('div');el.className='thinking-bubble';
  el.innerHTML=`<span style="font-size:15px">🤔</span><span class="thinking-dots"><span></span><span></span><span></span></span><span class="thinking-timer" id="thinking-timer">0.0s</span>`;
  $msgs.appendChild(el);
  thinkingEl=el;thinkingStart=Date.now();
  thinkingTimer=setInterval(()=>{
    const t=document.getElementById('thinking-timer');
    if(t)t.textContent=((Date.now()-thinkingStart)/1000).toFixed(1)+'s';
  },100);
  scrollBottom();
}
function hideThinking(){
  clearInterval(thinkingTimer);thinkingTimer=null;
  if(thinkingEl){thinkingEl.remove();thinkingEl=null}
}

// ══ 6-D Image Skeleton ══
function addImageSkeleton(jobId){
  const el=document.createElement('div');el.className='image-placeholder';
  el.innerHTML=`<div class="image-placeholder-inner"></div><div class="image-placeholder-label"><div class="spinner"></div><span>正在生成图片…</span><span class="status-badge queued" id="sk-badge-${esc(jobId)}">queued</span></div>`;
  $msgs.appendChild(el);
  imagePlaceholders[jobId]=el;
  scrollBottom();return el;
}
function updateSkeletonBadge(jobId,status){
  const b=document.getElementById('sk-badge-'+jobId);
  if(b){b.className='status-badge '+status;b.textContent=status}
}
function replaceSkeleton(jobId,url){
  const ph=imagePlaceholders[jobId];
  const card=document.createElement('div');card.className='image-card';
  card.innerHTML=`<img src="${esc(url)}" alt="generated" loading="lazy" onclick="window.open('${esc(url)}','_blank')"><div class="image-meta"><a href="${esc(url)}" target="_blank">Open full image →</a></div>`;
  if(ph){ph.replaceWith(card);delete imagePlaceholders[jobId]}
  else $msgs.appendChild(card);
  scrollBottom();
}

// ══ 6-E Error Card ══
let lastUserText='';
function addErrorCard(msg){
  const c=document.createElement('div');c.className='error-card';
  c.innerHTML=`
    <div class="error-card-header">⚠️ 御 出错了</div>
    <div class="error-card-msg">${esc(msg)}</div>
    <button class="error-retry-btn">重试</button>
  `;
  c.querySelector('.error-retry-btn').addEventListener('click',()=>{
    if(lastUserText){
      $input.value=lastUserText;
      updateSendBtn();
      $input.focus();
    }
  });
  $msgs.appendChild(c);scrollBottom();
}

// ══ 6-E Send button state ══
function updateSendBtn(){
  const has=$input.value.trim().length>0;
  $sendBtn.disabled=!has;
  $sendBtn.classList.toggle('ready',has);
}

// Timeline
const $tlOverlay=document.getElementById('timeline-overlay');
const $ivTimeline=document.getElementById('iv-timeline');
const $tlToggle=document.getElementById('timeline-toggle');
let tlMode=false,currentIvToolEntry=null;
$tlToggle.addEventListener('click',()=>{tlMode=!tlMode;$tlToggle.classList.toggle('active',tlMode);$tlOverlay.classList.toggle('open',tlMode);updateIvStats()});
document.getElementById('iv-close').addEventListener('click',()=>{tlMode=false;$tlToggle.classList.remove('active');$tlOverlay.classList.remove('open')});
function updateIvStats(){
  const sseOk=sse&&sse.readyState===1;
  document.getElementById('iv-dot-sse').className='iv-stat-dot '+(sseOk?'green':'gray');
  document.getElementById('iv-val-sse').textContent=sseOk?'Live':'--';
  document.getElementById('iv-dot-session').className='iv-stat-dot '+(sessionId?'green':'gray');
  document.getElementById('iv-val-session').textContent=sessionId?sessionId.slice(0,8)+'…':'—';
  document.getElementById('iv-dot-turns').className='iv-stat-dot '+(ivTurns?'blue':'gray');
  document.getElementById('iv-val-turns').textContent=ivTurns;
  document.getElementById('iv-dot-tools').className='iv-stat-dot '+(ivTools?'blue':'gray');
  document.getElementById('iv-val-tools').textContent=ivTools;
  document.getElementById('iv-dot-images').className='iv-stat-dot '+(Object.keys(images).length?'green':'gray');
  document.getElementById('iv-val-images').textContent=Object.keys(images).length;
}
function addTlEntry(type,label,html,ts){
  const icons={user:'👤',agent:'🤖',tool:'🔧',image:'🖼️',error:'⚠️'};
  const prev=$ivTimeline.lastElementChild;
  if(prev){const col=prev.querySelector('.tl-line-col');if(col&&!col.querySelector('.tl-connector')){const line=document.createElement('div');line.className='tl-connector';col.appendChild(line)}}
  const entry=document.createElement('div');entry.className='tl-entry tl-'+type;
  entry.innerHTML=`<div class="tl-line-col"><div class="tl-dot">${icons[type]||'●'}</div></div><div class="tl-body"><div class="tl-label">${esc(label)}</div><div class="tl-content">${html}</div><div class="tl-time">${fmtTime(ts||new Date().toISOString())}</div></div>`;
  $ivTimeline.appendChild(entry);
  requestAnimationFrame(()=>{$ivTimeline.scrollTop=$ivTimeline.scrollHeight});
  return entry;
}

// Main event handler
function handleEvent(ev){
  logDebug(ev);updateIvStats();
  switch(ev.event){
    case 'session.connected':setStatus('online','Connected');break;

    case 'user.message':
      ivTurns++;
      addTlEntry('user','User Input',esc(ev.data.content||''),ev.timestamp);
      updateIvStats();break;

    case 'assistant.started':
      showThinking();
      currentBubble=addBubble('agent');
      currentBubble.style.display='none';
      currentToolCard=null;currentIvToolEntry=null;
      twQueue=[];twRunning=false;twBubble=null;
      streamBuffer='';
      break;

    case 'assistant.delta':{
      const delta=ev.data.delta||'';if(!delta)break;
      streamBuffer+=delta;
      if(thinkingEl){hideThinking();if(currentBubble)currentBubble.style.display=''}
      if(currentBubble){
        const b=currentBubble.querySelector('.bubble');
        b.classList.add('streaming'); // plain text mode while streaming
        twEnqueue(delta,b);
      }
      break;
    }

    case 'assistant.completed':{
      const content=ev.data.content||streamBuffer;
      hideThinking();
      if(currentBubble){
        currentBubble.style.display='';
        const b=currentBubble.querySelector('.bubble');
        // flush typewriter, apply markdown
        twFlush(content,b);
        scrollBottom();
      }
      currentBubble=null;streamBuffer='';
      if(content)addTlEntry('agent','Agent Response',esc(content),ev.timestamp);
      break;
    }

    case 'tool.started':
      ivTools++;
      hideThinking();
      currentToolCard=addToolCard(ev.data.tool_name,'running',ev.data.input);
      scrollBottom();
      currentIvToolEntry=addTlEntry('tool','Tool Call',`Calling <code>${esc(ev.data.tool_name)}</code><span class="tl-badge running">running</span>`,ev.timestamp);
      updateIvStats();break;

    case 'tool.finished':{
      const ok=ev.data.ok!==false;
      if(currentToolCard)updateToolCard(currentToolCard,ok?'done':'failed',ev.data.output);
      if(currentIvToolEntry){const b=currentIvToolEntry.querySelector('.tl-badge');if(b){b.className='tl-badge '+(ok?'completed':'failed');b.textContent=ok?'done':'failed'}}
      break;
    }

    case 'image.task.created':
      tasks[ev.data.job_id]={status:ev.data.status||'queued',planId:ev.data.generation_plan_id};
      addImageSkeleton(ev.data.job_id);
      if(currentToolCard)addTaskMeta(currentToolCard,ev.data);
      if(currentIvToolEntry){
        const c=currentIvToolEntry.querySelector('.tl-content');
        const row=document.createElement('div');row.style.marginTop='4px';
        row.innerHTML=`job: <code>${esc(String(ev.data.job_id))}</code><span class="tl-badge queued" id="iv-badge-${esc(ev.data.job_id)}">${ev.data.status||'queued'}</span>`;
        c.appendChild(row);
      }
      break;

    case 'image.task.updated':
      if(tasks[ev.data.job_id])tasks[ev.data.job_id].status=ev.data.status;
      updateSkeletonBadge(ev.data.job_id,ev.data.status);
      if(currentToolCard)updateBadge(currentToolCard,ev.data.job_id,ev.data.status);
      {const ivb=document.getElementById('iv-badge-'+ev.data.job_id);if(ivb){ivb.className='tl-badge '+ev.data.status;ivb.textContent=ev.data.status}}
      break;

    case 'image.completed':
      tasks[ev.data.job_id]={...(tasks[ev.data.job_id]||{}),status:'completed'};
      images[ev.data.job_id]={url:ev.data.image_url};
      replaceSkeleton(ev.data.job_id,ev.data.image_url);
      addTlEntry('image','Image Ready',`<a href="${esc(ev.data.image_url)}" target="_blank" style="color:#B09FCC">Open →</a><br><img src="${esc(ev.data.image_url)}" alt="generated" onclick="window.open('${esc(ev.data.image_url)}','_blank')">`,ev.timestamp);
      updateIvStats();break;

    case 'agent.error':{
      const msg=ev.data.error||'Unknown error';
      hideThinking();
      if(currentBubble){currentBubble.remove();currentBubble=null}
      // 6-E: replace with error card
      addErrorCard(msg);
      addTlEntry('error','Error',esc(msg),ev.timestamp);
      break;
    }
  }
}

// Chat DOM
const $msgs=document.getElementById('chat-messages');
function addBubble(role,text){
  const w=document.createElement('div');w.className='bubble-wrap '+role;
  const b=document.createElement('div');b.className='bubble '+role;
  if(text!==undefined) b.textContent=text;
  w.appendChild(b);$msgs.appendChild(w);scrollBottom();return w;
}
function addToolCard(name,state,inputData){
  const c=document.createElement('div');c.className='tool-card';
  const inputStr=inputData?JSON.stringify(inputData,null,2):'';
  c.innerHTML=`
    <div class="tool-header">
      <div class="tool-icon ${state}">${iconFor(state)}</div>
      <span>${esc(name)}</span>
      <span class="tool-chevron">▼</span>
    </div>
    <div class="tool-meta"></div>
    ${inputStr?`<div class="tool-detail">${esc(inputStr)}</div>`:''}`;
  c.addEventListener('click',()=>c.classList.toggle('open'));
  $msgs.appendChild(c);return c;
}
function updateToolCard(c,state,outputData){
  const i=c.querySelector('.tool-icon');i.className='tool-icon '+state;i.innerHTML=iconFor(state);
  if(outputData){
    let d=c.querySelector('.tool-detail');
    if(!d){d=document.createElement('div');d.className='tool-detail';c.appendChild(d)}
    d.textContent=(d.textContent?d.textContent+'\n\n--- output ---\n':'')+JSON.stringify(outputData,null,2);
  }
}
function iconFor(s){return s==='running'?'<div class="spinner"></div>':s==='done'?'✓':'✗'}
function addTaskMeta(card,data){
  const m=card.querySelector('.tool-meta');
  const r=document.createElement('span');
  r.innerHTML=`job: <code>${esc(String(data.job_id||''))}</code>&nbsp;<span class="status-badge ${data.status||'queued'}" id="badge-${esc(data.job_id)}">${data.status||'queued'}</span>`;
  m.appendChild(r);
}
function updateBadge(c,jobId,status){
  const b=c.querySelector('#badge-'+jobId);
  if(b){b.className='status-badge '+status;b.textContent=status}
}
function scrollBottom(){requestAnimationFrame(()=>{$msgs.scrollTop=$msgs.scrollHeight})}

// Tasks
function renderTasks(){
  const $l=document.getElementById('tasks-list');$l.innerHTML='';
  const entries=Object.entries(tasks).reverse();
  if(!entries.length){$l.innerHTML='<div class="empty-state"><div class="empty-icon">📋</div><p>No tasks yet</p></div>';return}
  entries.forEach(([jobId,t])=>{
    const el=document.createElement('div');el.className='task-item';
    el.innerHTML=`<div class="task-top"><span class="task-id">${esc(jobId)}</span><span class="status-badge ${t.status}">${t.status}</span></div>${t.planId?`<div class="task-plan">plan: ${esc(t.planId)}</div>`:''}`;
    $l.appendChild(el);
  });
}

// Gallery
function renderGallery(){
  const $g=document.getElementById('gallery-grid');$g.innerHTML='';
  const entries=Object.entries(images).reverse();
  if(!entries.length){$g.innerHTML='<div class="empty-state"><div class="empty-icon">🖼️</div><p>No images yet</p></div>';return}
  entries.forEach(([jobId,img])=>{
    const el=document.createElement('div');el.className='gallery-img-wrap';
    el.innerHTML=`<img src="${esc(img.url)}" alt="image" loading="lazy" onclick="window.open('${esc(img.url)}','_blank')"><div class="gallery-meta">${esc(jobId.slice(0,12))}…</div>`;
    $g.appendChild(el);
  });
}

// Debug
function updateDebugInfo(){
  document.getElementById('debug-info').textContent=JSON.stringify({
    session_id:sessionId,gateway:BASE_URL,
    sse:sse?['CONNECTING','OPEN','CLOSED'][sse.readyState]:'none',
    tasks:Object.keys(tasks).length,images:Object.keys(images).length,
  },null,2);
}
function logDebug(ev){
  const $de=document.getElementById('debug-events');
  const el=document.createElement('div');el.className='debug-event';
  el.innerHTML=`<span class="ev-type">${esc(ev.event)}</span> ${esc(JSON.stringify(ev.data||{}))}`.slice(0,240);
  $de.prepend(el);if($de.children.length>100)$de.lastChild.remove();
}

// Send
const $input=document.getElementById('chat-input');
const $sendBtn=document.getElementById('send-btn');
$input.addEventListener('input',()=>{
  $input.style.height='auto';
  $input.style.height=Math.min($input.scrollHeight,120)+'px';
  updateSendBtn();
});
async function sendMessage(){
  const text=$input.value.trim();if(!text||sending)return;
  lastUserText=text;
  sending=true;$sendBtn.disabled=true;$sendBtn.classList.remove('ready');
  $input.value='';$input.style.height='';
  updateSendBtn();
  addBubble('user',text);
  try{await api('POST','/api/agent/sessions/'+sessionId+'/messages',{content:text})}
  catch(err){
    if(!err.message.startsWith('401'))addErrorCard(err.message);
  }
  finally{sending=false;updateSendBtn();$input.focus()}
}
$sendBtn.addEventListener('click',sendMessage);
$input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}})

// Init
async function ensureSession(){
  if(sessionId){try{await api('GET','/api/agent/sessions/'+sessionId);return}catch{}}
  const d=await api('POST','/api/agent/sessions');
  sessionId=d.session_id;localStorage.setItem(SESSION_KEY,sessionId);
}
async function init(){
  setStatus('connecting','Initializing...');
  try{await ensureSession();connectSSE();updateDebugInfo();}
  catch(err){if(!err.message.startsWith('401'))setStatus('error','Connection failed')}
}

if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(token){hideLogin();init()}
</script>
