<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Leon Agent">
<meta name="theme-color" content="#2783DE">
<link rel="manifest" href="manifest.json">
<title>Leon Agent</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif;font-size:16px;line-height:1.5;background:#fff;color:#2C2C2B;-webkit-font-smoothing:antialiased}
:root{
  --blue:#2783DE;--blue-soft:#E5F2FC;
  --green:#46A171;--green-soft:#E8F1EC;
  --orange:#D5803B;--orange-soft:#FBEBDE;
  --red:#E56458;--red-soft:#FCE9E7;
  --purple:#7B5EA7;--purple-soft:#EDE8F5;
  --surface:#F9F8F7;--surface2:#F0EFED;
  --border:#E6E5E3;--text:#2C2C2B;--text2:#7D7A75;
  --nav-h:56px;--header-h:52px;
}
#app{position:fixed;top:0;left:0;width:100%;display:flex;flex-direction:column;height:var(--app-height,100dvh);min-height:0;overflow:hidden}

/* Login */
#login-screen{position:fixed;inset:0;background:#fff;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px calc(32px + env(safe-area-inset-bottom));gap:0}
#login-screen.hidden{display:none}
.login-logo{font-size:56px;margin-bottom:8px;line-height:1}
.login-title{font-size:26px;font-weight:700;letter-spacing:-.5px;margin-bottom:6px}
.login-sub{font-size:14px;color:var(--text2);margin-bottom:40px;text-align:center}
.login-field{width:100%;max-width:320px;margin-bottom:12px}
.login-field label{display:block;font-size:13px;font-weight:500;color:var(--text2);margin-bottom:6px}
.login-field input{width:100%;border:1.5px solid var(--border);border-radius:12px;padding:13px 16px;font-size:16px;outline:none;font-family:inherit;transition:border-color .15s}
.login-field input:focus{border-color:var(--blue)}
#login-error{color:var(--red);font-size:13px;min-height:18px;margin-bottom:4px;text-align:center;max-width:320px}
#login-btn{width:100%;max-width:320px;padding:15px;background:var(--blue);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;margin-top:4px;transition:opacity .15s}
#login-btn:disabled{opacity:.5;cursor:default}
.login-hint{margin-top:20px;font-size:12px;color:var(--text2);text-align:center;max-width:300px}

/* Header */
#header{height:var(--header-h);display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--border);background:#fff;position:sticky;top:0;z-index:20}
#header h1{font-size:17px;font-weight:600;letter-spacing:-.3px}
#header-right{display:flex;align-items:center;gap:10px}
#status-wrap{display:flex;align-items:center;gap:6px}
#status-dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:background .3s}
#status-dot.online{background:var(--green)}
#status-dot.error{background:var(--red)}
#status-dot.connecting{background:var(--orange)}
#status-label{font-size:12px;color:var(--text2)}
#timeline-toggle{border:none;background:var(--surface2);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;color:var(--text2);transition:all .15s;white-space:nowrap}
#timeline-toggle.active{background:#1a1a2e;color:#fff}

/* Pages */
#pages{flex:1;min-height:0;overflow:hidden;position:relative}
.page{position:absolute;inset:0;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;touch-action:pan-y;display:none;flex-direction:column}
.page.active{display:flex}

/* Chat */
#page-chat{overflow:hidden;touch-action:none}
#chat-messages{flex:1;min-height:0;padding:12px 12px 8px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;touch-action:pan-y;overflow-anchor:none;scrollbar-gutter:stable}
#chat-input-wrap{flex-shrink:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:#fff;display:flex;align-items:flex-end;gap:8px;position:relative;z-index:5}
#chat-input{display:block;flex:1;width:100%;min-height:40px;border:1.5px solid var(--border);border-radius:20px;padding:9px 14px;font-size:16px;outline:none;resize:none;max-height:120px;line-height:1.4;font-family:inherit;color:var(--text);background:#fff;caret-color:var(--blue);-webkit-user-select:text;user-select:text;touch-action:manipulation;transition:border-color .15s}
#chat-input:focus{border-color:var(--blue)}
#send-btn{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:opacity .15s}
#send-btn:disabled{opacity:.4;cursor:default}

/* Bubbles */
.bubble-wrap{display:flex;flex-direction:column;max-width:85%;gap:2px}
.bubble-wrap.user{align-self:flex-end;align-items:flex-end}
.bubble-wrap.agent{align-self:flex-start;align-items:flex-start}
.bubble{padding:9px 13px;border-radius:18px;font-size:15px;line-height:1.45;word-break:break-word;white-space:pre-wrap}
.bubble.user{background:var(--blue);color:#fff;border-bottom-right-radius:5px}
.bubble.agent{background:var(--surface);color:var(--text);border-bottom-left-radius:5px}
.bubble.agent.streaming::after{content:'▋';animation:blink .7s step-start infinite}
@keyframes blink{50%{opacity:0}}

/* Tool cards */
.tool-card{align-self:flex-start;background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:10px 13px;font-size:13px;max-width:92%}
.tool-header{display:flex;align-items:center;gap:7px;font-weight:600;font-size:14px}
.tool-icon{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.tool-icon.running{background:var(--blue-soft);color:var(--blue)}
.tool-icon.done{background:var(--green-soft);color:var(--green)}
.tool-icon.failed{background:var(--red-soft);color:var(--red)}
.tool-meta{margin-top:6px;color:var(--text2);font-size:12px;display:flex;flex-direction:column;gap:3px}

/* Status badges */
.status-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.status-badge.queued{background:var(--surface2);color:var(--text2)}
.status-badge.running{background:var(--blue-soft);color:var(--blue)}
.status-badge.completed{background:var(--green-soft);color:var(--green)}
.status-badge.failed{background:var(--red-soft);color:var(--red)}

/* Image card */
.image-card{align-self:flex-start;border-radius:14px;overflow:hidden;border:1px solid var(--border);max-width:min(280px,85%)}
.image-card img{width:100%;display:block;object-fit:cover}
.image-card .image-meta{padding:8px 10px;font-size:11px;color:var(--text2);background:#fff}
.image-card .image-meta a{color:var(--blue);text-decoration:none}

/* Tasks page */
#page-tasks{padding:12px;gap:8px}
.task-item{background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:5px}
.task-top{display:flex;align-items:center;justify-content:space-between}
.task-id{font-size:12px;color:var(--text2);font-family:Menlo,monospace;word-break:break-all}
.task-plan{font-size:11px;color:var(--text2)}

/* Gallery */
#page-gallery{padding:12px;flex-direction:column;gap:8px}
#gallery-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.gallery-img-wrap{border-radius:12px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.gallery-img-wrap img{width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:pointer}
.gallery-meta{padding:6px 8px;font-size:11px;color:var(--text2)}

/* Debug */
.debug-section{background:var(--surface);border-radius:10px;padding:12px}
.debug-section h3{font-size:13px;font-weight:600;margin-bottom:8px}
.debug-section pre{font-family:Menlo,Consolas,monospace;font-size:11px;overflow-x:auto;color:var(--text2);white-space:pre-wrap;word-break:break-all}
#debug-events{max-height:260px;overflow-y:auto}
.debug-event{padding:4px 0;border-bottom:1px solid var(--border);font-size:11px;font-family:Menlo,monospace;color:var(--text2)}
.debug-event:last-child{border-bottom:none}
.ev-type{color:var(--blue);font-weight:600}
.debug-btn{margin-top:8px;padding:8px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;font-size:13px;cursor:pointer;width:100%}

/* Settings */
#page-settings{padding:12px;gap:8px}
.settings-section{background:var(--surface);border-radius:10px;padding:14px}
.settings-section h3{font-size:15px;font-weight:650;margin-bottom:4px}
.settings-sub{font-size:12px;color:var(--text2);margin-bottom:12px}
.settings-row{display:flex;align-items:center;gap:8px}
#model-input{flex:1;min-width:0;border:1px solid var(--border);border-radius:9px;background:#fff;color:var(--text);padding:10px 12px;font:inherit;font-size:14px}
#model-refresh{width:40px;height:40px;border:1px solid var(--border);border-radius:9px;background:#fff;color:var(--text2);font-size:21px;cursor:pointer;flex-shrink:0}
#model-save{border:1px solid var(--blue);border-radius:9px;background:var(--blue);color:#fff;padding:10px 13px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
#model-save:disabled{opacity:.5;cursor:default}
#model-status{min-height:18px;margin-top:8px;font-size:12px;color:var(--text2)}
#model-status.error{color:var(--red)}

/* UX polish merged from feat/leon-ux-polish */
#send-btn.ready{background:var(--blue);color:#fff}
#send-btn.ready:active{transform:scale(.92)}
.bubble.agent{white-space:normal;line-height:1.55}
.bubble.agent.streaming{white-space:pre-wrap}
.bubble.agent p{margin:.25em 0}
.bubble.agent p:first-child{margin-top:0}
.bubble.agent p:last-child{margin-bottom:0}
.bubble.agent h1,.bubble.agent h2,.bubble.agent h3{font-size:1em;font-weight:700;margin:.4em 0 .2em}
.bubble.agent ul,.bubble.agent ol{padding-left:1.4em;margin:.25em 0}
.bubble.agent li{margin:.1em 0}
.bubble.agent code{font-family:Menlo,monospace;font-size:13px;background:rgba(0,0,0,.06);border-radius:4px;padding:1px 5px}
.bubble.agent pre{background:rgba(0,0,0,.06);border-radius:8px;padding:10px 12px;overflow-x:auto;margin:.4em 0}
.bubble.agent pre code{background:none;padding:0;font-size:12px}
.bubble.agent blockquote{border-left:3px solid var(--border);padding-left:10px;color:var(--text2);margin:.3em 0}
.bubble.agent a{color:var(--blue);text-decoration:none}
.bubble.agent .markdown-image-link{display:block;margin:.45em 0;line-height:0}
.bubble.agent .markdown-image{display:block;width:auto;max-width:100%;max-height:60vh;object-fit:contain;border-radius:10px;border:1px solid var(--border);background:#fff;cursor:pointer}
.thinking-bubble{align-self:flex-start;display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:18px;border-bottom-left-radius:5px;padding:9px 14px;font-size:14px;color:var(--text2)}
.thinking-dots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--text2);margin:0 1.5px;animation:tdot .9s ease-in-out infinite}
.thinking-dots span:nth-child(2){animation-delay:.15s}
.thinking-dots span:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-4px);opacity:1}}
.thinking-timer{font-variant-numeric:tabular-nums;font-size:12px;opacity:.7;min-width:32px}
.tool-card{cursor:pointer;transition:border-color .15s}
.tool-card:hover{border-color:var(--blue)}
.tool-chevron{margin-left:auto;font-size:10px;color:var(--text2);transition:transform .2s}
.tool-card.open .tool-chevron{transform:rotate(180deg)}
.tool-detail{display:none;margin-top:8px;background:var(--surface);border-radius:8px;padding:8px 10px;font-size:12px;font-family:Menlo,monospace;color:var(--text2);white-space:pre-wrap;word-break:break-all;max-height:180px;overflow-y:auto}
.tool-card.open .tool-detail{display:block}
.error-card{align-self:flex-start;max-width:90%;background:var(--red-soft);border:1.5px solid var(--red);border-radius:12px;padding:10px 13px;display:flex;flex-direction:column;gap:6px}
.error-card-header{font-weight:600;font-size:14px;color:var(--red)}
.error-card-msg{font-size:13px;color:#7a2020;word-break:break-word;white-space:pre-wrap}
.error-retry-btn{align-self:flex-start;background:var(--red);color:#fff;border:none;border-radius:8px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer}
.image-placeholder{align-self:flex-start;width:min(260px,80%);border-radius:14px;overflow:hidden;border:1.5px solid var(--border);background:var(--surface)}
.image-placeholder-inner{width:100%;aspect-ratio:1;background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.image-placeholder-label{padding:8px 12px;font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px}
.image-card{animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============================================================
   TIMELINE OVERLAY
   ============================================================ */
#timeline-overlay{
  position:fixed;inset:0;z-index:100;
  background:#0f1117;
  display:flex;flex-direction:column;
  opacity:0;pointer-events:none;
  transition:opacity .25s;
}
#timeline-overlay.open{opacity:1;pointer-events:all}

/* Timeline header */
#iv-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px 12px;
  padding-top:calc(16px + env(safe-area-inset-top));
  border-bottom:1px solid rgba(255,255,255,.08);
  flex-shrink:0;
}
#iv-title{color:#fff;font-size:18px;font-weight:700;letter-spacing:-.3px}
#iv-subtitle{color:rgba(255,255,255,.45);font-size:12px;margin-top:1px}
#iv-close{border:none;background:rgba(255,255,255,.1);color:#fff;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}

/* Runtime status row */
#iv-status-bar{
  display:flex;gap:8px;padding:10px 20px;
  border-bottom:1px solid rgba(255,255,255,.06);
  overflow-x:auto;flex-shrink:0;
}
.iv-stat{
  display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.06);border-radius:8px;
  padding:5px 10px;white-space:nowrap;
}
.iv-stat-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.iv-stat-dot.green{background:#46A171}
.iv-stat-dot.blue{background:#2783DE;animation:pulse 1.5s ease-in-out infinite}
.iv-stat-dot.gray{background:#555}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.iv-stat-label{font-size:11px;color:rgba(255,255,255,.5)}
.iv-stat-value{font-size:12px;color:#fff;font-weight:600}

/* Timeline scroll area */
#iv-timeline{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:16px 20px calc(20px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:0;
}
.tl-entry{
  display:flex;gap:12px;
}
.tl-line-col{
  display:flex;flex-direction:column;align-items:center;
  flex-shrink:0;width:24px;
}
.tl-dot{
  width:24px;height:24px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;flex-shrink:0;
}
.tl-connector{
  width:2px;flex:1;min-height:12px;
  background:rgba(255,255,255,.08);
  margin:2px 0;
}
.tl-body{flex:1;padding-bottom:16px}
.tl-label{
  font-size:11px;font-weight:600;letter-spacing:.04em;
  text-transform:uppercase;margin-bottom:4px;
}
.tl-content{
  border-radius:10px;padding:10px 12px;
  font-size:13px;line-height:1.5;
}
.tl-content code{
  font-family:Menlo,monospace;font-size:12px;
  background:rgba(255,255,255,.08);border-radius:4px;padding:1px 4px;
}
.tl-time{font-size:10px;color:rgba(255,255,255,.3);margin-top:4px}

/* Entry themes */
.tl-user .tl-dot{background:#2783DE}
.tl-user .tl-label{color:#5E9FE8}
.tl-user .tl-content{background:rgba(39,131,222,.12);color:#C8E0FF}

.tl-agent .tl-dot{background:#46A171}
.tl-agent .tl-label{color:#72BC8F}
.tl-agent .tl-content{background:rgba(70,161,113,.1);color:#B8DDCA;white-space:pre-wrap}

.tl-tool .tl-dot{background:#D5803B}
.tl-tool .tl-label{color:#DE9255}
.tl-tool .tl-content{background:rgba(213,128,59,.1);color:#F5C79A}

.tl-image .tl-dot{background:#7B5EA7}
.tl-image .tl-label{color:#B09FCC}
.tl-image .tl-content{background:rgba(123,94,167,.1)}
.tl-image img{width:100%;max-width:240px;border-radius:8px;display:block;margin-top:6px;cursor:pointer}

.tl-error .tl-dot{background:#E56458}
.tl-error .tl-label{color:#E97366}
.tl-error .tl-content{background:rgba(229,100,88,.1);color:#FFBBB6}

.tl-badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 7px;border-radius:20px;font-size:10px;font-weight:600;
  margin-left:6px;
}
.tl-badge.queued{background:rgba(255,255,255,.1);color:rgba(255,255,255,.5)}
.tl-badge.running{background:rgba(39,131,222,.25);color:#5E9FE8}
.tl-badge.completed{background:rgba(70,161,113,.25);color:#72BC8F}
.tl-badge.failed{background:rgba(229,100,88,.25);color:#E97366}

/* Bottom nav */
#nav{height:var(--nav-h);display:flex;border-top:1px solid var(--border);background:#fff;padding-bottom:env(safe-area-inset-bottom)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:none;cursor:pointer;color:var(--text2);font-size:10px;font-weight:500;padding:6px 0;transition:color .15s}
.nav-icon{font-size:22px;line-height:1}
.nav-item.active{color:var(--blue)}

/* Misc */
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text2);padding:32px}
.empty-icon{font-size:40px}
.empty-state p{font-size:14px;text-align:center}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
</style>
</head>
<body>

<!-- Login -->
<div id="login-screen">
  <div class="login-logo">⚡</div>
  <div class="login-title">Leon Agent</div>
  <div class="login-sub">AI 生图个人助手</div>
  <div class="login-field">
    <label>Token</label>
    <input id="login-token" type="password" placeholder="输入访问密钥…" autocomplete="current-password">
  </div>
  <div id="login-error"></div>
  <button id="login-btn">连接</button>
  <p class="login-hint">首次使用请输入服务端配置的 LEON_API_TOKEN。<br>未设置 Token 时直接点击连接即可。</p>
</div>

<!-- Main app -->
<div id="app">
  <div id="header">
    <h1>⚡ Leon Agent</h1>
    <div id="header-right">
      <button id="timeline-toggle">Timeline</button>
      <div id="status-wrap">
        <div id="status-dot"></div>
        <span id="status-label">未连接</span>
      </div>
    </div>
  </div>

  <div id="pages">
    <div class="page active" id="page-chat">
      <div id="chat-messages"></div>
      <div id="chat-input-wrap">
        <textarea id="chat-input" placeholder="输入消息…" rows="1" enterkeyhint="send" autocomplete="off"></textarea>
        <button id="send-btn" aria-label="发送" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="page" id="page-tasks"><div id="tasks-list"></div></div>
    <div class="page" id="page-gallery"><div id="gallery-grid"></div></div>

    <div class="page" id="page-settings">
      <div class="settings-section">
        <h3>模型</h3>
        <p class="settings-sub" id="model-current">加载当前模型…</p>
        <div class="settings-row">
          <input id="model-input" list="model-options" placeholder="输入或选择模型 ID" autocomplete="off" spellcheck="false">
          <datalist id="model-options"></datalist>
          <button id="model-refresh" type="button" aria-label="刷新模型列表" title="刷新模型列表">↻</button>
          <button id="model-save" type="button" disabled>保存</button>
        </div>
        <div id="model-status" role="status"></div>
      </div>
      <div class="debug-section">

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function hideLogin(){$loginScreen.classList.add('hidden')}

async function doLogin(){

// API
async function api(method,path,body){
  const headers={'Content-Type':'application/json'};
  if(token)headers['Authorization']='Bearer '+token;
  const r=await fetch(BASE_URL+path,{method,headers,body:body?JSON.stringify(body):undefined});
  if(r.status===401){token='';localStorage.removeItem(TOKEN_KEY);stopSSE();showLogin('Token expired, please re-enter');throw new Error('401')}
  if(!r.ok)throw new Error(r.status+' '+await r.text());
  return r.json();
}

// Session model settings
const $modelInput=document.getElementById('model-input');
const $modelOptions=document.getElementById('model-options');
const $modelRefresh=document.getElementById('model-refresh');
const $modelSave=document.getElementById('model-save');
const $modelCurrent=document.getElementById('model-current');
const $modelStatus=document.getElementById('model-status');
let modelSettingsLoaded=false;
function fillModelSettings(data){
  $modelOptions.replaceChildren();
  const models=data.models||[];
  models.forEach(model=>{
    const option=document.createElement('option');
    option.value=model;$modelOptions.appendChild(option);
  });
  $modelInput.value=data.selected_model||'';
  $modelInput.placeholder='跟随默认 · '+data.default_model;
  $modelCurrent.textContent='当前：'+data.active_model+' · '+data.base_url;
  $modelStatus.className=data.catalog_error?'error':'';
  $modelStatus.textContent=data.catalog_error?'目录拉取失败，仍可手动输入模型 ID':'';
  modelSettingsLoaded=true;
}
async function loadModelSettings(refresh=false){
  if(!sessionId)return;
  $modelSave.disabled=true;$modelRefresh.disabled=true;$modelStatus.className='';
  $modelStatus.textContent=modelSettingsLoaded?'正在刷新…':'正在加载…';
  try{
    const suffix=refresh?'?refresh=true':'';
    fillModelSettings(await api('GET','/api/agent/sessions/'+sessionId+'/model'+suffix));
  }catch(err){
    $modelStatus.className='error';$modelStatus.textContent='加载失败：'+err.message;
  }finally{$modelSave.disabled=false;$modelRefresh.disabled=false}
}
async function saveModelSettings(){
  if(!sessionId)return;
  $modelSave.disabled=true;$modelStatus.className='';$modelStatus.textContent='正在保存…';
  try{
    const model=$modelInput.value.trim();
    fillModelSettings(await api('PUT','/api/agent/sessions/'+sessionId+'/model',{model:model||null}));
    $modelStatus.textContent='已保存，下条消息开始使用';
  }catch(err){
    $modelStatus.className='error';$modelStatus.textContent='保存失败：'+err.message;

}

// SSE
let sse=null,sseTimer=null;
function stopSSE(){
  clearTimeout(sseTimer);sseTimer=null;
  if(sse){sse.close();sse=null}
}
function connectSSE(){
  if(!sessionId)return;
  stopSSE();setStatus('connecting','Connecting...');
  const url=BASE_URL+'/api/agent/sessions/'+sessionId+'/events'+(token?'?token='+encodeURIComponent(token):'');
  sse=new EventSource(url);
  sse.onopen=()=>setStatus('online','Connected');
  sse.onerror=()=>{sse.close();sse=null;setStatus('error','Disconnected');sseTimer=setTimeout(connectSSE,3000)}
  sse.onmessage=e=>{try{handleEvent(JSON.parse(e.data))}catch{}}
}
window.addEventListener('online',()=>{clearTimeout(sseTimer);sseTimer=setTimeout(connectSSE,500)})

// State
const tasks={},images={};
let currentToolCard=null,currentBubble=null,sending=false;
let ivTurns=0,ivTools=0;
const imagePlaceholders={};
let streamBuffer='',lastUserText='',lastAgentErrorAt=0;

function safeHref(value){
  try{
    const url=new URL(value,location.origin);
    return ['http:','https:'].includes(url.protocol)?url.href:'';
  }catch{return ''}
}
function renderInline(raw){
  const tokens=[];
  const token=html=>{tokens.push(html);return '\u0000'+(tokens.length-1)+'\u0000'};
  let text=String(raw)
    .replace(/`([^`]+)`/g,(_,code)=>token('<code>'+esc(code)+'</code>'))
    .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,(_,label,url)=>{
      const href=safeHref(url);
      return href?token('<a class="markdown-image-link" href="'+esc(href)+'" target="_blank" rel="noopener"><img class="markdown-image" src="'+esc(href)+'" alt="'+esc(label||'图片')+'" loading="lazy"></a>'):esc(label||'图片');
    })
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(_,label,url)=>{
      const href=safeHref(url);
      return href?token('<a href="'+esc(href)+'" target="_blank" rel="noopener">'+esc(label)+'</a>'):label;
    });
  text=esc(text)
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g,'<em>$1</em>');
  return text.replace(/\u0000(\d+)\u0000/g,(_,index)=>tokens[Number(index)]||'');
}
function renderMd(raw){
  const lines=String(raw||'').split(/\r?\n/);
  const html=[];let inCode=false,code=[],inList=false;
  const closeList=()=>{if(inList){html.push('</ul>');inList=false}};
  for(const line of lines){
    if(line.startsWith('```')){
      if(inCode){html.push('<pre><code>'+esc(code.join('\n'))+'</code></pre>');code=[];inCode=false}
      else{closeList();inCode=true}
      continue;
    }
    if(inCode){code.push(line);continue}
    const item=line.match(/^\s*[-*]\s+(.+)$/);
    if(item){if(!inList){html.push('<ul>');inList=true}html.push('<li>'+renderInline(item[1])+'</li>');continue}
    closeList();
    if(!line.trim())continue;
    const heading=line.match(/^#{1,3}\s+(.+)$/);
    if(heading){html.push('<h3>'+renderInline(heading[1])+'</h3>');continue}
    const quote=line.match(/^>\s?(.*)$/);
    if(quote){html.push('<blockquote>'+renderInline(quote[1])+'</blockquote>');continue}
    html.push('<p>'+renderInline(line)+'</p>');
  }
  closeList();
  if(inCode)html.push('<pre><code>'+esc(code.join('\n'))+'</code></pre>');
  return html.join('');
}

let twQueue=[],twBubble=null,twFrame=null,twFinalText=null;
function twReset(){
  if(twFrame)cancelAnimationFrame(twFrame);
  if(twBubble&&twFinalText!==null){
    twBubble.classList.remove('streaming');twBubble.innerHTML=renderMd(twFinalText);
  }
  twQueue=[];twBubble=null;twFrame=null;twFinalText=null;
}
function twEnqueue(text,bubble){
  twBubble=bubble;twQueue.push(...Array.from(text));
  if(!twFrame)twFrame=requestAnimationFrame(twTick);
}
function twTick(){
  twFrame=null;
  if(twBubble&&twQueue.length){
    const count=Math.min(2,twQueue.length);
    for(let i=0;i<count;i++)twBubble.textContent+=twQueue.shift();
    scrollBottom();twFrame=requestAnimationFrame(twTick);return;
  }
  if(twBubble&&twFinalText!==null){
    twBubble.classList.remove('streaming');twBubble.innerHTML=renderMd(twFinalText);twFinalText=null;scrollBottom();
  }
}
function twComplete(finalText,bubble){
  twBubble=bubble;twFinalText=finalText;
  if(!twFrame)twFrame=requestAnimationFrame(twTick);
}

let thinkingEl=null,thinkingStart=0,thinkingTimer=null;
function showThinking(){
  hideThinking();
  const el=document.createElement('div');el.className='thinking-bubble';
  el.innerHTML='<span>思考中</span><span class="thinking-dots"><span></span><span></span><span></span></span><span class="thinking-timer">0.0s</span>';
  $msgs.appendChild(el);thinkingEl=el;thinkingStart=Date.now();
  thinkingTimer=setInterval(()=>{const t=el.querySelector('.thinking-timer');if(t)t.textContent=((Date.now()-thinkingStart)/1000).toFixed(1)+'s'},100);
  scrollBottom();
}
function hideThinking(){
  clearInterval(thinkingTimer);thinkingTimer=null;
  if(thinkingEl){thinkingEl.remove();thinkingEl=null}
}

function addImageSkeleton(jobId){

}
function updateSkeletonBadge(jobId,status){

  if(badge){badge.className='status-badge '+status;badge.textContent=status}
}
function replaceSkeleton(jobId,url){

  if(!card)return;
  if(placeholder){placeholder.replaceWith(card);delete imagePlaceholders[jobId]}else{$msgs.appendChild(card)}

function addErrorCard(message){
  const card=document.createElement('div');card.className='error-card';
  card.innerHTML=`<div class="error-card-header">请求失败</div><div class="error-card-msg">${esc(message)}</div><button class="error-retry-btn">重试</button>`;
  card.querySelector('.error-retry-btn').addEventListener('click',()=>{

// ============================================================
// Timeline overlay
// ============================================================
const $tlOverlay  = document.getElementById('timeline-overlay');
const $ivTimeline = document.getElementById('iv-timeline');
const $tlToggle   = document.getElementById('timeline-toggle');
let tlMode = false;
let currentIvToolEntry = null;

$tlToggle.addEventListener('click',()=>{ tlMode=!tlMode; $tlToggle.classList.toggle('active',tlMode); $tlOverlay.classList.toggle('open',tlMode); updateIvStats(); });
document.getElementById('iv-close').addEventListener('click',()=>{ tlMode=false; $tlToggle.classList.remove('active'); $tlOverlay.classList.remove('open'); });

function updateIvStats(){
  const sseOk=sse&&sse.readyState===1;
  document.getElementById('iv-dot-sse').className='iv-stat-dot '+(sseOk?'green':'gray');
  document.getElementById('iv-val-sse').textContent=sseOk?'Live':'--';

  document.getElementById('iv-dot-tools').className='iv-stat-dot '+(ivTools?'blue':'gray');

function addTlEntry(type,label,html,ts){
  const icons={user:'👤',agent:'🤖',tool:'🔧',image:'🖼️',error:'⚠️'};
  const prev=$ivTimeline.lastElementChild;
  if(prev){
    const col=prev.querySelector('.tl-line-col');
    if(col&&!col.querySelector('.tl-connector')){
      const line=document.createElement('div');line.className='tl-connector';col.appendChild(line);
    }
  }
  const entry=document.createElement('div');
  entry.className='tl-entry tl-'+type;
  entry.innerHTML=`
    <div class="tl-line-col"><div class="tl-dot">${icons[type]||'●'}</div></div>
    <div class="tl-body">
      <div class="tl-label">${esc(label)}</div>
      <div class="tl-content">${html}</div>
      <div class="tl-time">${fmtTime(ts||new Date().toISOString())}</div>
    </div>`;
  $ivTimeline.appendChild(entry);
  requestAnimationFrame(()=>{$ivTimeline.scrollTop=$ivTimeline.scrollHeight});
  return entry;
}

// ============================================================
// Event handler
// ============================================================
function handleEvent(ev){
  logDebug(ev);updateIvStats();
  switch(ev.event){
    case 'session.connected':setStatus('online','Connected');break;

    case 'user.message':
      ivTurns++;addTlEntry('user','User Input',esc(ev.data.content||''),ev.timestamp);updateIvStats();break;

    case 'assistant.started':
      showThinking();currentBubble=null;currentToolCard=null;currentIvToolEntry=null;
      streamBuffer='';twReset();break;

    case 'assistant.delta':{
      const delta=ev.data.delta||'';if(!delta)break;
      hideThinking();
      if(!currentBubble)currentBubble=addBubble('agent','',true);
      const bubble=currentBubble.querySelector('.bubble');
      streamBuffer+=delta;twEnqueue(delta,bubble);break;
    }

    case 'assistant.completed':{
      const content=ev.data.content||'';
      hideThinking();
      if(!currentBubble)currentBubble=addBubble('agent','',true);
      const bubble=currentBubble.querySelector('.bubble');
      if(!streamBuffer&&content)twEnqueue(content,bubble);
      twComplete(content||streamBuffer,bubble);
      currentBubble=null;
      if(content)addTlEntry('agent','Agent Response',esc(content),ev.timestamp);
      break;
    }

    case 'assistant.notice':{
      const content=ev.data.content||'';
      if(content){addBubble('agent',content,false);addTlEntry('agent','Agent Notice',esc(content),ev.timestamp)}
      break;
    }

    case 'tool.started':
      hideThinking();
      ivTools++;currentToolCard=addToolCard(ev.data.tool_name,'running',ev.data.input);scrollBottom();
      currentIvToolEntry=addTlEntry('tool','Tool Call',`Calling <code>${esc(ev.data.tool_name)}</code><span class="tl-badge running">running</span>`,ev.timestamp);
      updateIvStats();break;

    case 'tool.finished':{
      const ok=ev.data.ok!==false;
      if(currentToolCard)updateToolCard(currentToolCard,ok?'done':'failed',ev.data.output);
      if(currentIvToolEntry){const b=currentIvToolEntry.querySelector('.tl-badge');if(b){b.className='tl-badge '+(ok?'completed':'failed');b.textContent=ok?'done':'failed'}}
      break;
    }

    case 'image.task.created':
      tasks[ev.data.job_id]={status:ev.data.status||'queued',planId:ev.data.generation_plan_id};
      if(currentToolCard)addTaskMeta(currentToolCard,ev.data);
      addImageSkeleton(ev.data.job_id);
      if(currentIvToolEntry){
        const c=currentIvToolEntry.querySelector('.tl-content');
        const row=document.createElement('div');row.style.marginTop='4px';
        row.innerHTML=`job: <code>${esc(String(ev.data.job_id))}</code><span class="tl-badge queued" id="iv-badge-${esc(ev.data.job_id)}">${ev.data.status||'queued'}</span>`;
        c.appendChild(row);
      }
      break;

    case 'image.task.updated':
      if(tasks[ev.data.job_id])tasks[ev.data.job_id].status=ev.data.status;
      if(currentToolCard)updateBadge(currentToolCard,ev.data.job_id,ev.data.status);
      updateSkeletonBadge(ev.data.job_id,ev.data.status);
      {const ivb=document.getElementById('iv-badge-'+ev.data.job_id);if(ivb){ivb.className='tl-badge '+ev.data.status;ivb.textContent=ev.data.status}}
      break;

    case 'image.completed':
      tasks[ev.data.job_id]={...(tasks[ev.data.job_id]||{}),status:'completed'};
      images[ev.data.job_id]={url:ev.data.image_url};
      replaceSkeleton(ev.data.job_id,ev.data.image_url);
      {const href=safeHref(ev.data.image_url);if(href)addTlEntry('image','Image Ready',`<a href="${esc(href)}" target="_blank" rel="noopener" style="color:#B09FCC">Open full image →<br><img src="${esc(href)}" alt="generated"></a>`,ev.timestamp)}
      updateIvStats();break;

    case 'agent.error':{
      const msg=ev.data.error||'Unknown error';
      hideThinking();twReset();lastAgentErrorAt=Date.now();
      if(currentBubble){currentBubble.remove();currentBubble=null}
      addErrorCard(msg);addTlEntry('error','Error',esc(msg),ev.timestamp);
      break;
    }
  }
}

// Chat DOM
const $msgs=document.getElementById('chat-messages');
let autoFollowMessages=true;
function addBubble(role,text,streaming){
  const w=document.createElement('div');w.className='bubble-wrap '+role;
  const b=document.createElement('div');b.className='bubble '+role+(streaming?' streaming':'');
  if(role==='agent'&&!streaming)b.innerHTML=renderMd(text);else b.textContent=text;
  w.appendChild(b);$msgs.appendChild(w);scrollBottom();return w;
}
function addToolCard(name,state,inputData){
  const c=document.createElement('div');c.className='tool-card';
  const input=inputData?JSON.stringify(inputData,null,2):'';
  c.innerHTML=`<div class="tool-header"><div class="tool-icon ${state}">${iconFor(state)}</div><span>${esc(name)}</span><span class="tool-chevron">▼</span></div><div class="tool-meta"></div>${input?`<div class="tool-detail">input\n${esc(input)}</div>`:''}`;
  c.addEventListener('click',()=>c.classList.toggle('open'));
  $msgs.appendChild(c);return c;
}
function updateToolCard(c,state,outputData){
  const i=c.querySelector('.tool-icon');i.className='tool-icon '+state;i.innerHTML=iconFor(state);
  if(outputData){
    let detail=c.querySelector('.tool-detail');
    if(!detail){detail=document.createElement('div');detail.className='tool-detail';c.appendChild(detail)}
    detail.textContent+=(detail.textContent?'\n\n':'')+'output\n'+JSON.stringify(outputData,null,2);
  }
}
function iconFor(s){return s==='running'?'<div class="spinner"></div>':s==='done'?'✓':'✗'}
function addTaskMeta(card,data){
  const m=card.querySelector('.tool-meta');
  const r=document.createElement('span');
  r.innerHTML=`job: <code>${esc(String(data.job_id||''))}</code> &nbsp;<span class="status-badge ${data.status||'queued'}" id="badge-${esc(data.job_id)}">${data.status||'queued'}</span>`;
  m.appendChild(r);
}
function updateBadge(card,jobId,status){
  const b=card.querySelector('#badge-'+jobId);
  if(b){b.className='status-badge '+status;b.textContent=status}
}
function createImageCard(url){
  const href=safeHref(url);if(!href)return null;
  const c=document.createElement('div');c.className='image-card';
  const img=document.createElement('img');img.src=href;img.alt='generated';img.loading='lazy';
  img.addEventListener('click',()=>window.open(href,'_blank','noopener'));
  const meta=document.createElement('div');meta.className='image-meta';
  const link=document.createElement('a');link.href=href;link.target='_blank';link.rel='noopener';link.textContent='Open full image →';
  meta.appendChild(link);c.append(img,meta);return c;
}
function addImageCard(url){const c=createImageCard(url);if(c){$msgs.appendChild(c);scrollBottom()}}
function scrollBottom(force=false){
  if(!force&&!autoFollowMessages)return;
  requestAnimationFrame(()=>{$msgs.scrollTop=$msgs.scrollHeight});
}
$msgs.addEventListener('scroll',()=>{
  autoFollowMessages=$msgs.scrollHeight-$msgs.scrollTop-$msgs.clientHeight<80;
},{passive:true});
function syncVisualViewport(){
  const height=window.visualViewport?window.visualViewport.height:window.innerHeight;
  document.documentElement.style.setProperty('--app-height',Math.round(height)+'px');
  if(autoFollowMessages)scrollBottom(true);
}
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',syncVisualViewport,{passive:true});
  window.visualViewport.addEventListener('scroll',syncVisualViewport,{passive:true});
}else window.addEventListener('resize',syncVisualViewport,{passive:true});
syncVisualViewport();

let imageStateLoading=false,imageStateLoaded=false,imageStateError='';
async function loadImageState(){
  if(!sessionId||imageStateLoading)return;
  imageStateLoading=true;imageStateError='';renderTasks();renderGallery();
  try{
    const data=await api('GET','/api/agent/sessions/'+sessionId+'/image-state?limit=100');
    (data.tasks||[]).forEach(item=>{
      const jobId=String(item.job_id||'');if(!jobId)return;
      tasks[jobId]={...tasks[jobId],...item};
      if(item.image_url)images[jobId]={url:item.image_url,sourceText:item.source_text||''};
    });
    (data.images||[]).forEach(item=>{
      const jobId=String(item.job_id||'');if(jobId&&item.image_url)images[jobId]={url:item.image_url,sourceText:item.source_text||''};
    });
    imageStateLoaded=true;
    const errors=Object.values(data.errors||{});imageStateError=errors.join(' | ');
  }catch(err){imageStateError=err.message}
  finally{imageStateLoading=false;renderTasks();renderGallery();updateIvStats()}
}

// Tasks
function renderTasks(){
  const $l=document.getElementById('tasks-list');$l.innerHTML='';
  const entries=Object.entries(tasks).reverse();
  if(!entries.length){$l.innerHTML=`<div class="empty-state"><div class="empty-icon">📋</div><p>${imageStateLoading?'正在加载任务…':imageStateError?'任务加载失败':'No tasks yet'}</p></div>`;return}
  entries.forEach(([jobId,t])=>{
    const el=document.createElement('div');el.className='task-item';
    el.innerHTML=`<div class="task-top"><span class="task-id">${esc(jobId)}</span><span class="status-badge ${t.status}">${t.status}</span></div>${t.planId?`<div class="task-plan">plan: ${esc(t.planId)}</div>`:''}`;
    $l.appendChild(el);
  });
}

// Gallery
function renderGallery(){
  const $g=document.getElementById('gallery-grid');$g.innerHTML='';
  const entries=Object.entries(images).reverse();
  if(!entries.length){$g.innerHTML=`<div class="empty-state"><div class="empty-icon">🖼️</div><p>${imageStateLoading?'正在加载图库…':imageStateError?'图库加载失败':'No images yet'}</p></div>`;return}
  entries.forEach(([jobId,img])=>{
    const el=document.createElement('div');el.className='gallery-img-wrap';
    const href=safeHref(img.url);if(!href)return;
    const image=document.createElement('img');image.src=href;image.alt=img.sourceText||'image';image.loading='lazy';
    image.addEventListener('click',()=>window.open(href,'_blank','noopener'));
    const meta=document.createElement('div');meta.className='gallery-meta';meta.textContent=jobId.slice(0,12)+'…';
    el.append(image,meta);
    $g.appendChild(el);
  });
}

// Debug
function updateDebugInfo(){
  document.getElementById('debug-info').textContent=JSON.stringify({
    session_id:sessionId,gateway:BASE_URL,
    sse:sse?['CONNECTING','OPEN','CLOSED'][sse.readyState]:'none',
    tasks:Object.keys(tasks).length,images:Object.keys(images).length,
  },null,2);
}
function logDebug(ev){
  const $de=document.getElementById('debug-events');
  const el=document.createElement('div');el.className='debug-event';
  el.innerHTML=`<span class="ev-type">${esc(ev.event)}</span> ${esc(JSON.stringify(ev.data||{}))}`.slice(0,240);
  $de.prepend(el);if($de.children.length>100)$de.lastChild.remove();
}

// Send
const $input=document.getElementById('chat-input'),$sendBtn=document.getElementById('send-btn');
function updateComposerState(){
  const ready=!sending&&!!sessionId&&!!$input.value.trim();
  $sendBtn.disabled=!ready;$sendBtn.classList.toggle('ready',ready);
}
async function sendMessage(){
  const text=$input.value.trim();if(!text||sending||!sessionId)return;
  lastUserText=text;autoFollowMessages=true;
  sending=true;updateComposerState();
  $input.value='';$input.style.height='';
  addBubble('user',text,false);
  try{await api('POST','/api/agent/sessions/'+sessionId+'/messages',{content:text})}
  catch(err){
    if(!err.message.startsWith('401')&&!err.message.startsWith('500 ')&&Date.now()-lastAgentErrorAt>1000)addErrorCard(err.message);
  }
  finally{sending=false;updateComposerState();$input.focus()}
}
$sendBtn.addEventListener('click',sendMessage);
$input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}})
$input.addEventListener('input',()=>{
  $input.style.height='auto';$input.style.height=Math.min($input.scrollHeight,120)+'px';updateComposerState();
})
$input.addEventListener('focus',()=>{if(autoFollowMessages)setTimeout(()=>scrollBottom(true),50)})

// Init
async function ensureSession(){
  if(sessionId){try{return await api('GET','/api/agent/sessions/'+sessionId)}catch{}}
  const d=await api('POST','/api/agent/sessions');
  sessionId=d.session_id;localStorage.setItem(SESSION_KEY,sessionId);
  return {session_id:sessionId,messages:[]};
}
function renderHistory(messages){
  if($msgs.children.length)return;
  (messages||[]).forEach(message=>{
    if(message.role==='user'||message.role==='assistant')addBubble(message.role==='assistant'?'agent':'user',message.content||'',false);
  });
  autoFollowMessages=true;scrollBottom(true);
}
async function init(){
  setStatus('connecting','Initializing...');
  try{
    const session=await ensureSession();renderHistory(session.messages);
    connectSSE();updateDebugInfo();updateComposerState();loadImageState();
  }
  catch(err){if(!err.message.startsWith('401'))setStatus('error','Connection failed')}
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js?v=8',{scope:'/',updateViaCache:'none'})
    .then(registration=>registration.update()).catch(()=>{});
}
if(token){hideLogin();init()}
</script>
