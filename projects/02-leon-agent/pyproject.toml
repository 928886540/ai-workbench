[project]
name = "leon-agent"
version = "0.1.0"
description = "Leon Agent — AI 生图个人助手"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rich>=13.0",
    "workbench-core",
]

[project.scripts]
leon = "leon_agent.cli:main"
leon-server = "leon_agent.gateway.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leon_agent"]

[tool.uv.sources]
workbench-core = { workspace = true }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "BLE"]
