[project]
name = "leon-agent"
version = "0.1.0"
description = "Independent conversational agent with Leon image-generation tools."
requires-python = ">=3.10"
dependencies = [
  "workbench-core",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "prompt-toolkit>=3.0.47",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0.1",
]

[project.scripts]
leon = "leon_agent.cli:main"
leon-server = "leon_agent.gateway.server:main"
leon-config = "leon_agent.config_file:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leon_agent"]

[tool.uv.sources]
workbench-core = { workspace = true }
