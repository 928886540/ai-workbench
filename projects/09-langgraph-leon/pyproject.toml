[project]
name = "leon-agent-framework"
version = "0.1.0"
description = "LangGraph framework edition of Leon's agent orchestration."
requires-python = ">=3.10"
dependencies = [
  "leon-agent",
  "langchain-core>=1,<2",
  "langgraph>=1,<2",
]

[project.scripts]
leon-graph = "leon_framework.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leon_framework"]

[tool.uv.sources]
leon-agent = { workspace = true }
